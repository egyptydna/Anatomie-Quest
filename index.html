<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anatomie Quest · JKU</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf0ff;font-family:system-ui,-apple-system,sans-serif}header{padding:20px 26px;background:#141d35;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}small,.muted{color:#a6b3d2}.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 90px)}aside{background:#10182c;padding:18px;max-height:calc(100vh - 90px);overflow:auto}.item{display:block;width:100%;text-align:left;border:1px solid #283654;background:#17233d;color:#dbe6ff;border-radius:12px;padding:11px;margin:7px 0;cursor:pointer}.item.active{border-color:#9d8cff;background:#29284e}.item.done:before{content:'✓ ';color:#5de3ad}main{padding:25px;max-width:1000px;width:100%;margin:auto}.panel{background:#17223b;border:1px solid #2b3b59;border-radius:17px;padding:22px;margin-bottom:17px}button{background:#7969e9;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:650;margin:4px}button.secondary{background:#293957}button:disabled{opacity:.5;cursor:default}.progress{height:12px;background:#293957;border-radius:20px;overflow:hidden}.bar{height:100%;background:#69d9ad;transition:width .2s}pre{white-space:pre-wrap;word-break:break-word;line-height:1.7;font:inherit;color:#e2e8f7}.option{display:block;width:100%;text-align:left;background:#233251;margin:8px 0;padding:15px;border:1px solid #405276}.option.correct{border-color:#51d69a;background:#194c41}.option.wrong{border-color:#f38585;background:#532c40}.pill{display:inline-block;background:#302f62;padding:6px 12px;border-radius:30px;color:#c6bdff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.hide{display:none}input{background:#0d162a;border:1px solid #52607e;color:white;border-radius:9px;padding:12px;width:100%;max-width:420px}img.figure{width:100%;max-width:700px;border-radius:12px;background:white} @media(max-width:740px){.wrap{display:block}aside{max-height:180px}main{padding:13px}}</style></head><body><header><div><h1>🧠 Anatomie Quest</h1><small>Allgemeine Anatomie · JKU · 124 Folien</small></div><div><b id="xp">0 XP</b><div id="count"></div><div class="progress" style="width:180px"><div class="bar" id="prog"></div></div></div></header><div class="wrap"><aside><b>Deine 124 Lernlevel</b><p class="muted">Wähle eine Folie</p><div id="nav"></div></aside><main><h2 id="title"></h2><div class="tabs" id="tabs"></div><div id="content"></div></main></div><script>const L=[{"page": 1, "title": "Allgemeine Anatomie", "text": "Allgemeine Anatomie\nAnatomische Grundlagen\nSimon Neubauer"}, {"page": 2, "title": "Was ist Anatomie? Definitionen", "text": "Was ist Anatomie? Definitionen\nMorphologie: altgriechisch, μορφή (morphe): „Gestalt, Form“ und λόγος (logos): „Lehre“, Lehre von Form und Struktur von\nOrganismen\nAnatomie: altgriechisch, ἀνά (ana): „auf“ und τομή (tome): „Schnitt, Schneiden“, Zergliederung zum Erkenntnisgewinn der\nMorphologie\nMakroskopische Anatomie: beschreibt die mit bloßem Auge sichtbaren Strukturen\nMikroskopische Anatomie: beschreibt die mit Mikroskopen sichtbaren Strukturen (Histologie, Zytologie, Molekulare Anatomie)\nHistologie: Lehre der Gewebe\nZytologie: Lehre der Zellen\nEmbryologie: beschreibt die Entwicklung von Organismen\nTopographie: altgriechisch, τόπος (tópos): „Ort, Platz“ und γράφειν (gráphein): „zeichnen, beschreiben“, Lehre von den\nräumlichen Lagebeziehungen anatomischer Strukturen innerhalb einer Körperregion\nDeskriptive Anatomie: beschreibt anatomische Strukturen\nVergleichende Anatomie: vergleicht Baupläne verschiedener Organismen\nTopographische Anatomie: beschreibt räumliche Lage von und Beziehungen zwischen Strukturen\nSystematische Anatomie: gruppiert Strukturen des Körpers zu funktionell zusammenhängenden Organsystemen\nFunktionelle Anatomie: stellt Zusammenhänge zwischen Struktur und Funktion her\nKlinische Anatomie: angewandte Anatomie mit topographischen, systematischen & funktionellen Aspekten"}, {"page": 3, "title": "Bauplan des menschlichen Körpers", "text": "Bauplan des menschlichen Körpers\n• Hierarchie: Zellen > Gewebe > Organe > Organsysteme > Organismus\n• Symmetrie: bilateraler Grundbauplan mit rechter und linker Körperhälfte (Abweichung bei inneren Organen)\n• Segmentierung: serielle Wiederholung ähnlicher Strukturen (Wirbel, Rippen, Spinalnerven, …)\n• Röhrenbau: Hohlorgane mit Wand und Lumen (Gefäße, Darm, Atemwege, Harnwege)\n• Schichtung: funktionell unterschiedliche Gewebeschichten (z.B. Mukosa, Muskelschichten, Bindegewebe)\n• Spezialisierung: unterschiedliche Strutur für unterschiedliche Funktionen (Zell-, Gewebe- und Organspezialisierung)\n• Kompartimentierung: Abgrenzung anatomischer und funktioneller Räume (Körperhöhlen, Faszienräume, …)\n• Zentralisierung: Bündelung von Steuerung und Verarbeitung (Gehirn, Rückenmark, zentrale Kreislauforgane)\n• Vernetzung: Verbindung einzelner Strukturen zu funktionellen Netzwerken (Nerven, Gefäße, Lymphbahnen)\n• Oberflächenoptimierung: Oberflächenvergrößerung bei begrenztem Volumen (Falten, Zotten, Alveolen, …)"}, {"page": 4, "title": "Plastinate", "text": "Plastinate\n• Was sind Plastinate?\n§ Plastinate sind dauerhaft konservierte menschliche oder tierische Körper, Organe oder Gewebe.\n§ Dabei werden Wasser und lösliche Fette im Gewebe durch Kunststoffe (Polymere) wie Silikon\noder Epoxidharz ersetzt.\n§ Plastinate sind langlebig, trocken, weitgehend geruchlos und ermöglichen eine detailgetreue\nDarstellung anatomischer Strukturen.\n§ Sie werden insbesondere in der anatomischen Lehre und Forschung eingesetzt.\n• Wie werden Plastinate hergestellt?\n§ Fixierung und Präparation: Konservierung des Gewebes mit Formalin und Präparation der\ngewünschten anatomischen Strukturen\n§ Entwässerung und Entfettung: Wasser und lösliche Fette werden mithilfe von\nAceton aus dem Gewebe entfernt.\n§ Forcierte Imprägnierung: Im Vakuum wird das Aceton durch\nflüssigen Kunststoff (z. B. Silikon) ersetzt.\n§ Positionierung: Die anatomischen Strukturen werden in die\ngewünschte Lage gebracht und fixiert.\n§ Aushärtung: Der Kunststoff wird durch Gas, Wärme oder Licht\nausgehärtet. Das Präparat bleibt dann dauerhaft erhalten.\n§ Zeitaufwand: Die vollständige Präparation und Plastination eines\nmenschlichen Körpers kann rund 1.500 Arbeitsstunden erfordern\nund etwa ein Jahr dauern.\nvon Hagenskoerperwelten.de/pressePlastination"}, {"page": 5, "title": "Plastinate", "text": "Plastinate\n• Achten Sie das Vermächtnis der Körperspender:innen!\n• Gehen Sie respektvoll mit Plastinaten und Scheiben um!\n• Gehen Sie vorsichtig mit Plastinaten und Scheiben um!\nNicht reißen, zerren, knicken, biegen, anmalen, zerkratzen…\n• Plastinate sind auch zum Anfassen da, damit Sie Anatomie\n„begreifen“ können. Achten Sie auf saubere Hände!\n• Verwenden Sie nur Holzsonden (keine Metallsonden), wenn Sie\nStrukturen auf Plastinaten oder Scheiben zeigen!\n• Verwenden Sie Leuchttische zum Betrachten der Scheiben!\n• In den Unterrichtsräumen nicht essen und trinken!\n(Ausnahme: Wasser)\nFalls Ihnen ein beschädigtes\nPlastinat auffällt, geben Sie bitte\n• Kein Social Media!                    dem Lehrpersonal Bescheid!\n• Achten Sie auf Ordnung in den Unterrichtsräumen!\nvon Hagenskoerperwelten.de/pressePlastination"}, {"page": 6, "title": "Norm und Variation", "text": "Norm und Variation\n• Norm\n§ beschreibt die typische anatomische Ausprägung von Strukturen hinsichtlich Form, Größe, Lage und Aufbau\n• Anatomische Variation\n§ Abweichung von der häufigsten Ausprägung innerhalb der natürlichen Variationsbreite\n§ ohne Krankheitswert\n• Anomalie\n§ deutlich abweichende Ausbildung einer Struktur\n§ häufig entwicklungsbedingt\n§ auch nicht zwingend mit einer Funktionsstörung verbunden\n• Einflussfaktoren auf die anatomische Variation\n§ Geschlecht\n• Unterschiede in Größe, Form und Proportionen, z. B. Beckenform, Muskelmasse, Fettverteilung\n§ Alter\n• Veränderungen während Wachstum, Reifung und Alterung\n•  z. B. Körperproportionen, Knochenstruktur, Organvolumen\n§ Konstitution\n•  Individueller Körperbau\n•  z. B. schmaler oder breiter Körperbau, unterschiedliche Muskel- und Fettverteilung\n• Körpermaße: Unterschiede in Körpergröße, Körpergewicht, Organmaßen und Extremitätenlängen\n• Körperproportionen: unterschiedliche Größenverhältnisse von Kopf, Rumpf und Extremitäten\n• Anatomische Variation ist die Regel – nicht jede Abweichung von der Norm ist pathologisch."}, {"page": 7, "title": "Topographische Gliederung", "text": "Topographische Gliederung\n• Partes corporis                                                            • Cavitates corporis\n§ Caput (Kopf)                                              = Körperhöhle: Raum, der von Knochen, Muskeln und/oder\nBindegewebe begrenzt wird, um die darin enthaltenen Organe zu       § Collum (Hals)\nschützen, stabilisieren und ihre Bewegung zu ermöglichen\n§ Truncus (Rumpf)\n§ Cavitas cranii (Schädelhöhle)\n• Thorax (Brustkorb)\n§ Canalis vertebralis (Wirbelkanal)\n• Abdomen (Bauch)\n§ Cavitas thoracis (Brusthöhle)\n•  Pelvis (Becken)\n§ Cavitas abdominalis (Bauchhöhle)\n§ Membrum superius (obere Extremität)\n§ Cavitas pelvis (Beckenhöhle)\n• Cingulum membri superioris (Schultergürtel)\n• Pars libera membri superioris (freie obere Gliedmaße)\n§ Membrum inferius (untere Extremität)\n• Cingulum membri inferioris (Beckengürtel)                                                                                                     § Serosa: Mesothel, das Körperhöhle auskleidet\n• Pars libera membri inferioris (freie untere Gliedmaße)                                                                                                                  •  parietale Serosa: kleidet Wand der Körperhöhle aus\n•  viszerale Serosa: bedeckt Oberfläche der Organe\n• seröser Spalt\n• zwischen parietaler und viszeraler Serosa\n• mit Liquor serosus (von Serosa produziert) gefüllt\n• Reduktion der Reibung zwischen Organen und Höhlenwand >\nBeweglichkeit der Organe"}, {"page": 8, "title": "Körperhöhlen: Brusthöhle                                                                                                                                       seröse Höhlen (seröse Haut)", "text": "Körperhöhlen: Brusthöhle                                                                                                                                       seröse Höhlen (seröse Haut)\nBindegewebsräume\n• Cavitas thoracis (Brusthöhle)\n§ Cavitates pleurales (Pleurahöhlen mit Pleura)\nPulmones (Lungen)\n§ Mediastinum (Mittelfellraum zwischen den Pleurahöhlen)\n§ Teile der Speise- und Luftröhre, Thymus, Leitungsbahnen\n§ Cavitas pericardiaca (Herzbeutelhöhle mit Perikard)\nCor oder Cardia (Herz)\n• durch Diaphragma (Zwerchfell) von Cavitas abdominalis getrennt\nUmschlag\nparietal-viszeral\nparietales Blatt\nviszerales Blatt\nCavitas (seröser Spalt)"}, {"page": 9, "title": "Körperhöhlen: Bauchhöhle                                                                                                                                       seröse Höhlen (seröse Haut)", "text": "Körperhöhlen: Bauchhöhle                                                                                                                                       seröse Höhlen (seröse Haut)\nBindegewebsräume\n• Peritoneum (Bauchfell)\n§ Peritoneum parietale: kleidet Bauchwand aus\n§ Peritoneum viscerale: umgibt (intraperitoneale) Bauchorgane\n§ Meso oder Mesenterium (Gekröse): Peritonealduplikatur zwischen Organen und hinterer\nBauchwand zur Aufhängung der Organe, in der Leitungsbahnen verlaufen\n• Peritonealverhältnisse\n§ intraperitoneal: von Peritoneum viscerale umgeben und über Meso fixiert\n§ primär retroperitoneal: liegt dorsal der Cavitas peritonealis im Spatium retroperitoneale\n§ sekundär retroperitoneal: nur noch zum Teil mit Peritoneum\nbedeckt, da Hinterwand durch Verlagerung während des\nWachstums mit hinterer Bauchwand verwachsen ist"}, {"page": 10, "title": "Körperhöhlen: Bauchhöhle                                                                                                                                       seröse Höhlen (seröse Haut)", "text": "Körperhöhlen: Bauchhöhle                                                                                                                                       seröse Höhlen (seröse Haut)\nBindegewebsräume\n• Cavitas abdominalis (Bauchhöhle)\n§ Cavitas peritonealis abdominis (Peritonealhöhle mit Peritoneum)\n• Hepar (Leber)\n• Vesica biliaris (Gallenblase)\n• Splen (Milz)\n• Gaster (Magen)\n•  Teil des Duodenums (Zwölffingerdarm)\n• Jejunum und Ileum (Leerdarm und Krummdarm)\n• Caecum, Colon transversum, Colon sigmoideum (Dickdarmabschnitte)\n§ Spatium extraperitoneale (retroperitoneale) abdominis\n• primär retroperitoneal\n• Ren (Niere)\n• Ureter (Harnleiter)\n• Glandula suprarenalis (Nebenniere)\n• Aorta\n•  V. cava inferior\n• sekundär retroperitoneal\n• Pankreas (Bauchspeicheldrüse)\n•  Teile des Duodenums\n• Colon ascendens und descendens (Dickdarmabschnitte)\n•  Teile des Rektums"}, {"page": 11, "title": "Körperhöhlen: Beckenhöhle", "text": "Körperhöhlen: Beckenhöhle\n• Cavitas pelvis (Beckenhöhle)\n§ Cavitas peritonealis pelvis (Peritonealhöhle mit Peritoneum)\n•  Großteil des Uterus (Gebärmutter)\n• Ovarien (Eierstöcke)\n• Tuba uterina (Eileiter)\n§ Spatium extraperitoneale (retro/subperitoneale) pelvis\n• Vesica urinaria (Harnblase)\n•  Teile des Rektums (Mastdarms)\n•  Zervix uteri (Gebärmutterhals)\n• Vagina\n•  Prostata\n• Glandula vesiculosa (Bläschendrüse)\n§ Cavitates peritoneales abdominis et pelvis haben eine kontinuierliche\nseröse Auskleidung ohne muskuläre oder membranöse Trennung.\nseröse Höhlen (seröse Haut)\nBindegewebsräume"}, {"page": 12, "title": "Funktionelle Gliederung", "text": "Funktionelle Gliederung\n• Bewegungsapparat (Muskuloskelettales System)                                                                         ANG\n§ Skelett mit Bandverbindungen (passiv)\nBEW                                                                                               § quergestreifte Skelettmuskulatur (aktiv)\n• Stoffwechselapparat (Eingeweide)\n§ Respirationssystem (Atmung)\nHKA\n§ Kardiovaskuläres System (Herz und Kreislauf)\n§ Gastrointestinalsystem (Verdauung)          EVS\n§ Hämolymphatisches System (Immunsystem)                                KUH   BUI\n§ Uropoetisches System (Harnsystem)\n§ Endokrines System (Hormonsystem)\nUUE\n• Fortpflanzungsapparat\n§ Genitalsystem (weiblich und männlich)\nAnatomie Unterricht                                • Kommunikationsapparat                      PRÄP\n§ Sinnesorgane\nfolgt hauptsächlich der funktionellen Gliederung                                                           HUS\n§ Integumentsystem"}, {"page": 13, "title": "Anatomische Terminologie", "text": "Anatomische Terminologie\n• Fachsprache, um anatomische Regionen, Körperteile und Lagebeziehungen sachlich,\neindeutig und systematisch beschreiben zu können                                                                         aktuelle Version\nauf Moodle\n•  Grundposition, Körperachen, Körperebenen, Richtungsbezeichungen, Beziehung zwischen\nStrukturen, Bewegungen, einheitliches System zur Benennung anatomischer Strukturen\n• seit 1998: Terminologia Anatomica (TA): etwa 8000 Begriffe, vor allem Latein, aber\nauch Griechisch\n• Benennung anatomischer Strukturen\n•  Grundbegriff: Art der Struktur (z.B. Arterie, Muskel, Nerv,…), erster Buchstabe wird groß geschrieben\n• Zusatz/Zusätze: nähere Beschreibung als Adjektiv angefügt, klein geschrieben\n•  Lage, Form, Größe,Verlauf, Richtung, Funktion, Zahl,…\n•  z.B. Sulcus tendinis musculi flexoris hallucis longi\n(Rinne für die Sehne des langen Großzehen-Beugemuskels)"}, {"page": 14, "title": "Anatomische Neutralposition", "text": "Anatomische Neutralposition\n• standardisierte Körperhaltung als Referenz zur Beschreibung\nvon Lage- und Richtungsbezeichnungen am Körper\n§ aufrechter Stand\n§ Blick nach vorne\n§ seitlich (lateral) herab hängende Arme\n§ Handflächen nach vorne (anterior)\n§ Daumen nach außen (lateral)\n§ hüftbreite, parallele Füße mit nach vorne zeigenden Zehen\n• Neutral-Null-Stellung\n§ Handflächen zeigen nur Körpermitte (nach medial)\n§ Das Bewegungsausmaß eines Gelenks wird in den\nmöglichen Freiheitsgraden als Winkelgrade von der\nNeutral-Null-Stellung (nicht der anatomischen\nNeutralposition) dokumentiert.\nACHTUNG!\nNeutral-Null                 Anatomische\nStellung                  Normalposition"}, {"page": 15, "title": "Anatomische Achsen und Ebenen", "text": "Anatomische Achsen und Ebenen\n• Longitudinal- oder Vertikalachse                                     • Sagittalebene (Längsschnitt, s)\n• Transversal- oder Horizontalachse                                   • Medianebene (m)\n• Sagittalachse                                                               • Frontal- oder Coronalebene (Stirn- oder Wandschnitt, f)\n• Transversal- oder Axialebene (Querschnitt, t)\nm                 f\ns\nt\nm*\nf\nm*\nDalley & Agur, Moore‘s Clinically Oriented Anatomy"}, {"page": 16, "title": "Anatomische Lagebezeichnungen & Richtungen", "text": "Anatomische Lagebezeichnungen & Richtungen\nsuperior\ncranial         zum Kopf gehörend (kopfwärts gelegen)                                                                                           cranial\ncaudal         zum Steiß gehörend (schwanzwärts gelegen)                           superficial\nventral          bauchwärts gelegen\noccipital              rostral                                                                                                                                caudal\ndorsal           rückenwärts gelegen                                                                      intermediär\nrostral           schnabel/schnauzenwärts gelegen\noccipital       zum Hinterkopf gelegen\nsuperior          der Obere                                                                                                                                                                      lateral\ndorsal\nmedial       inferior           der Untere                                                                                                   posterior                                                                                               profund\nventral      anterior          der Vordere\nanterior\nposterior         der Hintere\nproximal                            ulnar\nmedius           der Mittlere                                                 radialis           speichenwärts                                                                                           radial                                                                                                                                                                   distal\ntransversus       der Quere                                                ulnaris            ellenwärts\ndexter            rechts                                                            tibialis            schienbeinseitig\ndorsal  palmar\nsinister             links                                                          fibularis          wadenbeinseitig\nmedial            zur Medianebene hin                                     superficial         oberflächlich                                                                                           sinister\ndexter       lateral          von der Medianebene weg (seitlich)                  intermedius      zwischen (oberflächlich und tief)\nproximal        rumpfnah (zum Rumpf hin)                         profund             tief                                                                                                    tibial\nfibular\ndistal            rumpffern (zum Ende der Gliedmaßen hin)            externus        außen gelegen\npalmar/plantar    zur Hohlhand- bzw. Fußsohlenseite hin                internus          innen gelegen\ndorsal         zum Hand- bzw. Fußrücken hin                      intermedius      dazwischen gelegen\ndorsal\nplantar\ninferior\nDalley & Agur, Moore‘s Clinically Oriented Anatomy"}, {"page": 17, "title": "Anatomische Lagebezeichnungen & Richtungen", "text": "Anatomische Lagebezeichnungen & Richtungen\nsagittal                horizontal           coronal/frontal\nrostral\n(frontal)\ncaudal\n(occipital)"}, {"page": 18, "title": "Schnittbilder: medizinische Bildgebungsverfahren", "text": "Schnittbilder: medizinische Bildgebungsverfahren\nCT und MRT Bilder werden als\nSchnittbilder betrachtet\nradiologische Schnittebenen\n• koronare Ebene\n• sagittale Ebene\nAnsicht von kaudal                                                                  • axiale Ebene\nAnsicht von distal"}, {"page": 19, "title": "Bewegungsachsen und -richtungen: Beispiel Hüftgelenk", "text": "Bewegungsachsen und -richtungen: Beispiel Hüftgelenk\n• Hüftgelenk\n§ Nussgelenk: Gelenkpfanne (Acetabulum) und Gelenkkopf (Caput femoris)\n§ 3 Hauptachsen (Freiheitsgrade) und 6 Hauptbewegungen\n•   Axis transversalis, Planum sagittale\n•   Flexion (Beugung)\n•   Extension (Streckung)\n•   Axis longitudinalis, Planum transversale\n•   Lateralrotation (Rotation nach außen)\n•   Medialrotation (Rotation nach innen)\n•   Axis sagittalis, Planum frontale\n•   Abduktion (Wegführen)\n•   Adduktion (Heranführen)\n• Weitere Bewegungen\n§   Zirkumduktion\n§   Anteversion/Retroversion\n§   Supination/Pronation\n§   Elevation/Depression\n§   Protraktion/Retraktion"}, {"page": 20, "title": "Muskuloskelettales System", "text": "Muskuloskelettales System\n• Funktionen\n§ Stütze und Formgebung\n§ Bewegung und Fortbewegung\n§ Körperhaltung\n§ Schutz innerer Organe\n§ Speicherung von Mineralstoffen\n§ Blutbildung\n§ Wärmeproduktion\n• Bauplan\n§ passiver Bewegungsapparat\n• Knochen\n• Knorpel\n• Bänder\n§ aktiver Bewegungsapparat\n• Skelettmuskulatur\n• Sehnen\n§ Prinzip\n• Muskeln wirken über Sehnen auf Knochen\n• Knochen sind über Gelenke beweglich miteinander verbunden\nvon Hagens Plastination"}, {"page": 21, "title": "Knochen des Skeletts", "text": "Knochen des Skeletts\nTrivia\nDer längste Knochen                          206   ist das Femur.\nKnochen\nDer kleinste Knochen                                        27   ist der Stapes.                                                                        Hand-\nknochen\nDas Hyoid steht mit\nkeinem anderen                                       26\nKnochen in                                                                             Fuß-\nVerbindung.                                                                      knochen\nkg                         7-9\nRadius, Clavicula & Humerus                        +100\nzählen zu den am häufigsten                                           Knochen\ngebrochenen Knochen.                                                          bei Babys"}, {"page": 22, "title": "Knochen: Knochentypen und Knochenstrukturen", "text": "Knochen: Knochentypen und Knochenstrukturen\nKnochentypen\n• Ossa longa (lange Röhrenknochen mit Corpus inklusive Cavitas medullaris und Extremitates)\n• Ossa brevia (kurze Knochen ohne Cavitas medullaris, stattdessen Spongiosa im Kern)\n• Ossa plana (flache Knochen aus zwei kompakten Lamellen und innen liegender Spongiosa)\n• Ossa irregularia (unregelmäßige Knochen, die nicht in andere Kategorien passen)\n• Ossa pneumatica (Knochen, die Luft und mit Schleimhaut ausgekleidete Räume enthalten)\n• Ossa sesamoidea (Sesambeine, die in Sehnen eingelagert sind)\n• Ossa accessoria (akzessorische Knochen, die nicht jeder Mensch hat)\nKnochenststrukturen\nFixierung von Muskeln, Sehnen und Bändern oder\nDurchtrittsöffnungen von Leitungsbahnen\n• Incisura (Einschnitt)                                                                                          • Tuberculum (Höckerchen)\n• Sulcus (Rinne)                                                                                          • Condylus (Knorren)\n• Fossa (Vertiefung, Grube)                                                                                          • Capitulum (Köpfchen)\n• Foramen (Loch)                                                                                          • Tuberositas (Rauigkeit)\n• Margo (Kante)                                                                                          • Crista (Kamm)\n• Spina (Spitze)                                                                                          • Labrum (Lippe)\n• Facies (Fläche)                                                                                          • Linea (Linie)\n• Angulus (Winkel)                                                                                          • Processus (Fortsatz)"}, {"page": 23, "title": "Knochen: Funktionen", "text": "Knochen: Funktionen\n• mechanische Stabilität und Beweglichkeit\n• Schutz von Organen\n• Hämatopoese\n• Homöostase von Mineralien und Nährstoffen\n§ Gleichgewicht des Kalzium- und Phosphathaushalts durch Einbau in und Freigabe aus Knochen\n§ wichtigster Kalziumspeicher\n§ Regulation über Hormone\n(z.B. Knochen kann die Insulinproduktion im Pankreas anregen)"}, {"page": 24, "title": "Knochen: Aufbau", "text": "Knochen: Aufbau\nhyaliner Gelenkknorpel\nEpiphysenlinie\nSubstantia spongiosa\n(mit Medulla ossium rubra)                                                                  Periost       Endost\nApophyse            Substantia compacta                        Cavitas medullaris\n(mit Medulla ossium flava)\nproximale                                                                                              distale\nEpiphyse                                                                            Epiphyse\nMetaphyse                             Diaphyse                       Metaphyse"}, {"page": 25, "title": "Knochen: Pars ossea", "text": "Knochen: Pars ossea\n• Substantia compacta (Kompakta, Kortikalis)\n§ etwa 80 % des Knochengesamtgewichts\n§ dicht gepackt\n§ Knochenoberfläche\n§ 0,5 bis 3 mm dick\n• Substantia spongiosa (Spongiosa, Diploë)\n§ etwa 20 % des Knochengesamtgewichts\n§ schwammartiges Netz aus Knochenbälkchen (Trabekeln)\n§ im Knocheninneren"}, {"page": 26, "title": "ZUGKnochen: Pars ossea", "text": "ZUGKnochen: Pars ossea\n• 10-20 % Wasser                                                                                                          unterstützt\n• wasserfreie Matrix                                             Verformbarkeit\n§ 65 % anorganische (mineralische) Substanzen\n• Hydroxylapatit\nein hydroxyliertes Calciumphosphatsalz\n[Ca10(PO4)6(OH)2]\nCalcium im Knochen eines Erwachsenen etwa 1 kg                               Steifigkeit       Druck\n• Magnesium, Kalium, Chlor, Eisen, Strontium, etc.\n§ 35 % organische Matrixkomponenten\n• 90 % Kollagen (v.a. Typ 1)\n• 10 % Proteoglykane & Glykoproteine\n(z.B. Osteonektin, Osteocalcin)                                              Elastizität       Zug\n• Knochenzellen\n§ Osteoblasten\n§ Osteozyten\n§ Osteoklasten\n• Knochengewebearten\n§ Geflechtknochen                                        mechanische Stabilität\n§ Lamellenknochen"}, {"page": 27, "title": "ZUGKnochen: Pars membranacea", "text": "ZUGKnochen: Pars membranacea\nSharpey Fasern   • Periost (äußere Knochenhaut) mit 2 Schichten\n§ Stratum fibrosum mit geflechtartigem, straffen Bindegewebe und Sharpey Fasern zur\nfesten Verbindung zwischen Periost und Knochen, dient als Ansatz für Sehnen und Bänder\n§ Stratum osteogenicum mit mesenchymalen Knochenstammzellen und Osteoblast-\nVorläuferzellen, ist stark innerviert und reich vaskularisiert (damit schmerzempfindlich)\n• Endost (innere Knochenhaut)\n§ kleidet die Binnenräume aus\n§ dünne Bindegewebsschicht aus abgeplatteten, osteogenen Zellen                                   Stratum osteogenicum\nStratum fibrosum\n• Funktionen\n§ Kraftübertragung\n§ Blutversorgung                                           Endost           Periost\n§ Wachstum & Regeneration\n§ Frakturheilung"}, {"page": 28, "title": "BUIKnochen: Knochenmark (Medulla ossium)", "text": "BUIKnochen: Knochenmark (Medulla ossium)\n• Medulla ossium rubra\n§ in Epiphysen von Röhrenknochen und Spongiosa von Wirbeln, Costae, Sternum, Beckenknochen\n§ blutbildend ab 4. Schwangerschaftsmonat\n§ bei der Geburt gibt es fast ausschließlich rotes Knochenmark\n• Medulla ossium flava\n§ in Diaphysen von Röhrenknochen\n§ „inaktives“ Knochenmark, das nicht mehr zur Blutbildung fähig ist\n§ Fetteinlagerung durch Retikulumzellen"}, {"page": 29, "title": "ZUGKnorpel (Cartilago)", "text": "ZUGKnorpel (Cartilago)\nist formkonstant & druckelastisch und dient als Stoßdämpfer und dem Formerhalt\n• Vorkommen bzw. Funktion\n§ Gelenkknorpel (Reibungsreduktion & Gleitfähigkeit)\n§ formgebende Skelettelemente im Primordialskelett\n§ formgebende Teile im adulten Skelett (Rippenknorpel, Kehlkopf)\n§ Knorpelhaften (Verbindung zwischen Knochen)\n• Knorpelarten\n§ elastischer Knorpel\n•  zellreicher Knorpel mit Perichondrium\n• Ohrmuschel, äußerer Gehörgang, Ohrtrompete, Kehldeckel\n§ Faserknorpel\n•  zellarmer Knorpel ohne Perichondrium\n•  Menisci, Gelenklippen, Symphysen und Zwischenwirbelscheiben\n§ hyaliner Knorpel\n•  milchig-bläulicher Knorpel mit Zellgruppen und maskierten Kollagenfasern\n• mit Perichondrium: Nase, Kehlkopf, Luftröhre, Bronchien, Rippen\n• ohne Perichondrium: Knorpel an artikulierenden Knochen"}, {"page": 30, "title": "Knochen: Mechanik", "text": "Knochen: Mechanik\n• Leichtbauweise: wenig Material, aber hohe Stabilität (Lamellenknochen, Spongiosa, Röhrenknochen)\n• Wolffsches Gesetz (Gesetz der Transformation der Knochen)\n„form follows       § Trabekeln in Spongiosa sind entlang der Druck- und/oder Zugtrajektorien ausgerichtet                            function“\n§ Zug- und Drucktrabekeln verlaufen ungefähr rechtwinkelig zueinander\n§ je nach mechanischer Belastung wird Knochen umgebaut (Auf- und Abbau)\n§ auch Kortikalis kann dicker oder dünner werden\n• Konstruktion des Röhrenknochens\n(siehe Muskeln)       § neutrale Faser                            Zuggurtung\n§ Biegespannung"}, {"page": 31, "title": "Gelenke des Skeletts", "text": "Gelenke des Skeletts\nTrivia\n360                                                     UnserGelenkgrößtes,ist daskomplexestesKniegelenk.\n„Gelenke“\ndavon    140\nechte Gelenke                                                         Das kleinste Gelenk ist das\nincudostapediale Gelenk.\nUnechte Gelenke sind\nkaum beweglich.\nDas am häufigsten verletzte\nGelenk ist das Kniegelenk.\nKnacken in Fingergelenken\nentsteht durch ein Vakuum bei\ndem gelöstes CO2 in den                                Das am meisten benutzte Gelenk\ngasförmigen Zustand übergeht.                                    ist das temporomandibuläre Gelenk."}, {"page": 32, "title": "Knochenverbindungen", "text": "Knochenverbindungen\n• Synarthrosen (unechte Gelenke)\n§ kontinuierliche Verbindung zwischen Knochen\n§ Zusammenhalt, aber geringe Beweglichkeit\n§ wichtig als Wachstumszonen\n§ 3 Arten je nach Füllgewebe\n• Junctura fibrosa (Bindegewebe)\n• Junctura cartilaginea (Knorpel)\n• Junctura ossea (Knochen)\n• Diarthrosen (echte Gelenke, Articulationes synoviales)\n§ diskontinuierliche Verbindung zwischen Knochen mit Gelenkspalt\n§ unterschiedliche Bewegungen mit definiertem Bewegungsumfang\n§ Funktionen: Bewegung, Stabilität, Stoßdämpfung\n§ verschiedene Arten je nach Gelenksform und Bewegungsmöglichkeit"}, {"page": 33, "title": "Synarthrosen: Junctura fibrosa", "text": "Synarthrosen: Junctura fibrosa\n• Syndesmose (Bandhaft)\n§ z.B. Membrana interossea antibrachii,\nSyndesmosis tibiofibularis\n• Sutur (Naht)\n§ Sutura serrata (Zackennaht), z.B. Kranznaht\n§ Sutura squamosa (Schuppennaht), z.B. S. squamosa o. temporalis\n§ Sutura plana (Glattnaht), z.B. mittlere Gaumennaht\n• Schindylesis (Nutennaht)\n§ Knochenkamm in spaltförmiger Vertiefung, z.B. Vomer/Os sphenoidale\n• Gomphosis (Einzapfung)\n§ Zahnwurzeln in alveolärem Knochen"}, {"page": 34, "title": "Synarthrosen: Junctura cartilaginea", "text": "Synarthrosen: Junctura cartilaginea\n• Synchondrose (Knorpelhaft)\n§ hyaliner Knorpel\n§ z.B. Wachstumsfugen, Synchondrosis sternocostalis, Synchondrosis sphenooccipitalis\n• Symphyse (Verwachsung)\n§ Faserknorpel\n§ z.B. Symphysis pubica, Symphysis intervertebralis"}, {"page": 35, "title": "Synarthrosen: Junctura ossea", "text": "Synarthrosen: Junctura ossea\n• Synostose\n§ nachträglich ossifiziertes Füllgewebe (Knochen)\n§ z.B. verknöcherte Wachstums-/Epiphysenfugen, Os sacrum"}, {"page": 36, "title": "Diarthrosen – Articulationes synoviales", "text": "Diarthrosen – Articulationes synoviales\n• diskontinuierliche Verbindung mit Gelenkspalt und mit definiertem Bewegungsumfang\n§ Caput articulare mit hyalinem Gelenkknorpel                                                                                                   „echte“                                                                                                  Gelenke       § Fossa articularis mit hyalinem Gelenkknorpel\n§ Cavum articulare (Gelenkhöhle) mit Synovia\n§ Capsula articularis (Gelenkkapsel)\n§ Hilfsstrukturen\n• Ligamenta (Bänder)\n•  Disci und Menisci (Zwischenscheiben)\n• Labra articularia (Pfannenlippen)\n• Bursae synoviales (Schleimbeutel)"}, {"page": 37, "title": "Diarthrosen: Gelenkkapsel & Gelenkschmiere", "text": "Diarthrosen: Gelenkkapsel & Gelenkschmiere\n• Membrana fibrosa: derbes, kollagenes Bindegewebe\n• Membrana synovialis: lockeres Bindegewebe auf der Innenseite\n§ subsynoviales Bindegewebe\n• mechanische Verbindung zum straffen, fibrösen Teil der Gelenkkapsel\n• Leitungsbahnen\n•  viele Mechano- und Schmerzrezeptoren\n§ synoviale Intima\n•  zellreiche Schicht mit Synovialozyten zur Bildung von                                         ZUG\nSynovia & Phagozytose\n• Synovia (Gelenkschmiere)\n§ hochvisköse, klare, leicht\ngelbliche Flüssigkeit\n§ Funktionen\n• Schmierung\n• Ernährung\n• Stoßdämpfung\nSynovia                                                (griechisch                                                           syn: mit, ovum: Ei)                                      ähnelt Eiklar                                                       in                                                  Konsistenz &                                                            Aussehen."}, {"page": 38, "title": "Diarthrosen: Zwischenscheiben & Pfannenlippen", "text": "Diarthrosen: Zwischenscheiben & Pfannenlippen\n• Disci articulares\n§ aus Faserknorpel und straffem Bindegewebe\n§ oft mit Gelenkkapsel verbunden\n§ füllen Gelenkhöhle aus und trennen in zwei Kammern\n§ z.B. Kiefergelenk\n• Menisci articulares\n§ aus Faserknorpel und straffem Bindegewebe\n§ sichelförmig/keilförmig am Gelenkrand\n§ z.B. Kniegelenk\n• Labrum articulare\n§ aus Faserknorpel und Bindegewebe\n§ Vergrößerung der Gelenkpfanne\n§ z.B. Schultergelenk, Hüftgelenk"}, {"page": 39, "title": "Diarthrosen: Bursae synoviales (Schleimbeutel)", "text": "Diarthrosen: Bursae synoviales (Schleimbeutel)\n• druckelastischer, mit Synovia gefüllter Beutel, der ähnlich wie Gelenkkapsel aufgebaut ist\n§ mit Gelenkshöhle kommunizierend (z.B. Bursa subacromialis)\n§ selbständig, nicht kommunizierend (z.B. Bursa prepatellaris)\n• ermöglicht Gleiten von Sehnen und Muskeln über Knochen, Reibungsminderung\nKLINIK\nVORSICHT!\nBursitis (informaticus)                                                                                                              olecrani:                                                                        “Studentenellenbogen“,                                                                   durch              Schleimbeutelentzündung                                                                        mechanische                                                                                           Dauerbelastung, wenn die                                                                     Ellenbogen beim Lesen häufig                                                                                                                aufgestellt werden"}, {"page": 40, "title": "Diarthrosen: Ligamente", "text": "Diarthrosen: Ligamente\n• extraartikuläre, platte oder strangförmige feste Verdichtung meist parallel laufender\nkollagener Bindegewebsfasern zur Verbindung beweglicher Skelettteile\n§ intrakapsulär\n• mit Membrana synovialis bedeckt (z.B. Kreuzbänder des Knies)\n•  in der Membrana fibrosa (z.B. inneres Seitenband des Knies)\n§ extrakapsulär\n• außerhalb der Gelenkkapsel (z.B. äußeres Seitenband des Knies)\n• Funktionen\n§ Verstärkung der Gelenkkapsel (z.B. Ligg. pubofemorale & iliofemorale)\n§ Führung und Sicherung des Gelenks (z.B. Lig. anulare radii = Speichenringband)\n§ Hemmung der Gelenkbewegung (z.B. Lig. coracoacromiale)"}, {"page": 41, "title": "Diarthrosen: Einteilung", "text": "Diarthrosen: Einteilung\n• Anzahl der artikulierenden Skelettelemente\n§ Articulationes simplices\n§ Articulationes compositae\n• Gelenkform (gegeben durch Form der Gelenkkörper)\n• Gelenkachsen\n• Freiheitsgrade\n• Bewegungsmöglichkeiten"}, {"page": 42, "title": "Diarthrosen: Formen von Gelenkkörpern", "text": "Diarthrosen: Formen von Gelenkkörpern\n• ebene Gelenkkörper\n• konvexer Gelenkkörper\n§ Caput articulare (kugel-, eiförmig)\n§ Trochlea articularis (walzenförmig)\n§ Condylus articularis (bikonvex gekrümmt)\n• konkaver Gelenkkörper\n§ Fossa articularis (tiefe Pfanne)\n§ Fovea oder Cavitas articularis (flache Pfanne)\n§ Incisura articularis (rinnenförmig)"}, {"page": 43, "title": "Diarthrosen: einachsige Gelenke", "text": "Diarthrosen: einachsige Gelenke\n• Articulatio plana (ebenes Gelenk)\n§ plane, flache Gelenkflächen\n§ Translations- und Drehbewegungen\n§ Besonderheit: 2 Translationsfreiheitsgrade\n§ z.B. Artt. zygapophysiales (Wirbelbogengelenke)"}, {"page": 44, "title": "Diarthrosen: einachsige Gelenke", "text": "Diarthrosen: einachsige Gelenke\n• Articulatio cylindrica (Walzengelenk)\n§ Ginglymus (Scharniergelenk)\n• konkaver und konvexer Gelenkkörper\n•  1 Achse: Flexion/Extension\n•  z.B. Art. humeroulnaris\n§ Articulatio conoidea (Zapfengelenk)\n• beweglicher Gelenkkörper dreht sich\nin konkaver Gelenkspfanne\n•  1 Achse: Rotationsbewegung\n•  z.B. Art. radioulnaris proximalis\n§ Articulatio trochoidea (Radgelenk)\n• konkave Gelenkpfanne dreht sich\num konvexen Gelenkkörper\n•  1 Achse: Rotationsbewegung\n•  z.B. Art. atlantoaxialis mediana, Art. radioulnaris distalis"}, {"page": 45, "title": "Diarthrosen: zweiachsige Gelenke", "text": "Diarthrosen: zweiachsige Gelenke\n• Articulatio ellipsoidea (Eigelenk)\n§ konkaver und eiförmiger konvexer Gelenkkörper\n§ 2 Achsen: Flexion/Extension, Abduktion/Adduktion\n§ z.B. Art. radiocarpalis (Handgelenk)\n• Articulatio sellaris (Sattelgelenk)\n§ zwei sattelförmige Gelenkkörper\n§ 2 Achsen: Flexion/Extension, Abduktion/Adduktion\n§ z.B. Art. carpometacarpalis pollicis (Daumensattelgelenk)\n• Articulatio bicondylaris (Kondylengelenk)\n§ konvexer Gelenkkörper mit zwei Kondylen\n§ 2 Achsen: Flexion/Extension, Innen-/Außenrotation\n§ z.B. Art. genus (Kniegelenk)"}, {"page": 46, "title": "Diarthrosen: dreiachsige Gelenke", "text": "Diarthrosen: dreiachsige Gelenke\n• Articulatio spheroidea (Kugelgelenk)\n§ zwei senkrecht aufeinanderstehende Gelenkkörper, die sich\nim Zentrum der Kugel schneiden und ein Achsenkreuz bilden\n§ 3 Achsen: Flexion/Extension, Abduktion/Adduktion, Innen-/\nAußenrotation, Zirkumduktion\n§ z.B. Art. humeri (Schultergelenk)\n• Enarthrosis spheroidea (Nussgelenk)\n§ Sonderform des Kugelgelenks bei dem die Gelenkpfanne\nüber den Äquator des Gelenkkopfes hinaus reicht\n§ 3 Achsen mit eingeschränkter Bewegung: Flexion/ Extension,\nAbduktion/Adduktion, Innen-/Außenrotation, Zirkumduktion\n§ z.B. Art. coxae (Hüftgelenk)"}, {"page": 47, "title": "Diarthrosen: Sonderfall – Amphiarthrosen", "text": "Diarthrosen: Sonderfall – Amphiarthrosen\n• Merkmale echter Gelenke, aber kaum Bewegung möglich\n• Form der Gelenkkörper und/oder straffe Bänder schränken Beweglichkeit stark ein\n• z.B. Art. sacroiliaca"}, {"page": 48, "title": "Gelenkmechanik: Kinematik", "text": "Gelenkmechanik: Kinematik\n• Osteokinematik\n§ Rotation\n§ Translation\n• Arthrokinematik\n§ Rollen\n§ Gleiten\n§ Rollgleiten\nZeit                    Ort\nGeschwindigkeit\nBeschleunigung"}, {"page": 49, "title": "Gelenkmechanik: Osteokinematik", "text": "Gelenkmechanik: Osteokinematik\n• Rotationsbewegungen\n§ ein Gelenkkörper bewegt sich um eine Bewegungsachse\n§ drei Hauptachsen (sagittal, transversal, longitudinal)\n§ maximal 3 Freiheitsgrade für Rotationsbewegungen\n§ maximal 6 Bewegungen: Flexion/Extension, Abduktion/Adduktion,\nInnen-/Außenrotation\n• Translationsbewegungen\n§ ein Gelenkkörper bewegt sich relativ zum zweiten Gelenkkörper in\nx-, y- und/oder z-Richtung\n§ theoretisch maximal 3 Freiheitsgrade für Translationsbewegungen\n§ maximal 6 Richtungen: nach superior/inferior, anterior/posterior,\nlateral/medial\n§ Translation meist in nur einer Ebene (in 2 oder 1 Richtung), daher\ntatsächlich nur 1 oder 2 Freiheitsgrade\n• Kombination aus Rotations- & Translationsbewegungen\n• theoretisch maximal 6 Freiheitsgrade der Beweglichkeit"}, {"page": 50, "title": "Gelenkmechanik: Arthrokinematik", "text": "Gelenkmechanik: Arthrokinematik\n• Gleiten\n§ Punkt einer Gelenkfläche berührt nacheinander verschiedene\nPunkte der anderen sich vorbei bewegenden Gelenkfläche\n§ Bewegungsachse ist fix\n§ Rotationsbewegung ohne Weggewinn\n§ z.B. Abduktion in der Art. humeri\n• Rollen\n§ Bewegungsachse „bewegt“ sich während der Bewegung selbst\n§ Gelenkkörper rollt sich auf gleich langem anderen Gelenkkörper ab\n§ Rotationsbewegung mit Weggewinn\n§ z.B. Flexion und Extension in der Art. genus\n• Drehgleiten\n§ Kombination aus Gleiten und Rollen\n§ Anteil des Rollens ist abhängig von\n• Form der Gelenkflächen\n• Anpressdruck\n• Schmierung"}, {"page": 51, "title": "Gelenkmechanik: Dynamik", "text": "Gelenkmechanik: Dynamik\nKinematik\n+\nZeit                      Ort\nGeschwindigkeit\nBeschleunigung\nKraft               Masse\nKinetik\nStatik"}, {"page": 52, "title": "Gelenkmechanik: Hebelgesetz", "text": "Gelenkmechanik: Hebelgesetz\n• Kräfte\n§ Schwerkraft der Last\n§ Muskelkraft\n• Hebelarme\n§ Lastarm b: Abstand von Gelenkachse zur Last\n§ Kraftarm a: Abstand von Gelenkachse zum Muskel\n(bzw. seiner Sehne)\n• Hebelgesetz\n§ Drehmoment = Kraft . Hebelarm\n• ML = FL . b\n• MM = FM . a\n§ Statik: MM = ML\n§ Kinetik: MM > ML oder MM < ML\n• Hebelarten\n§ zweiseitiger Hebel: Angriffspunkte der Kräfte liegen auf\nunterschiedlichen Seiten des Drehpunkts\n§ Angriffspunkte liegen auf einer Seite des Drehpunkts\n•  einseitiger Geschwindigkeitshebel: Kraftarm ist\nkürzer als der Lastarm\n•  einseitiger Lasthebel: Lastarm ist kürzer als Kraftarm"}, {"page": 53, "title": "Gelenkmechanik: Kinematische Ketten", "text": "Gelenkmechanik: Kinematische Ketten\n• Körper ist eine Aneinanderreihung von Gelenken und Hebeln\n§ offene kinematische Kette                                                         § geschlossene kinematische Kette\n•  letztes Glied ist frei beweglich                                                         • zwei Fixpunkte\n• keine mechanische Kopplung der Kettenmitglieder                            • mechanische Kopplung der Kettenmitglieder\n•  z.B. Füße baumeln, freie Hände                                                        • „Zwangsbewegungen“\n•  z.B. Kniebeuge, Gehen\nyoutu.be/tacuDMaWJ4w, youtu.be/vGSO5bM6Qz8"}, {"page": 54, "title": "Gelenkmechanik: Verkehrsraum & Gelenkhemmung", "text": "Gelenkmechanik: Verkehrsraum & Gelenkhemmung\n• Verkehrsraum ist der Bewegungsspielraum eines Gelenkes\n§ abhängig von Gelenkform\n• Gelenkhemmung begrenzt den Verkehrsraum\n§ Knochenhemmung\n§ Bandhemmung\n§ Muskelhemmung\n§ Weichteilhemmung"}, {"page": 55, "title": "Gelenkmechanik: Gelenkdruck & mechanische Beanspruchung", "text": "Gelenkmechanik: Gelenkdruck & mechanische Beanspruchung\n• Belastung im Gelenk\n§ Last: (Teil-)Körpergewicht K\n§ wirkende Muskelkräfte M\n• Gelenkresultierende R\n§ resultierende Druckkraft\n§ ergibt sich aus Addition des Körpergewichts und Muskelkraft\nin einem Kräfteparallelogramm\n§ geht durch das Drehzentrum D des Gelenks\n• mechanische Beanspruchung durch Gelenkdruck\n§ Druckverteilung im Gelenk ist relevant\n§ abhängig von\n• Größe der Fläche, die Kräfte aufnimmt\n• Deckungsgleichheit der artikulierenden Flächen"}, {"page": 56, "title": "Arthrose                                                                       KLINIK", "text": "Arthrose                                                                       KLINIK\n• degenerative Gelenkserkrankung mit Veränderungen von Knorpel- und Knochenstruktur\n§ Missverhältnis von Belastung und Belastbarkeit des Gelenkknorpels bei Über- & Fehlbelastungen,\nFehlstellungen, Übergewicht, Bewegungsmangel, nach Traumata (Sport!)\n§ Knorpel ist gefäßlos (bradytroph), daher ist seine Regenerationsfähigkeit sehr eingeschränkt\n§ über die Zeit kann auch der subchondrale Knochen betroffen sein\n§ Symptome: anfangs symptomlos, später entzündliche Reaktionen, Gelenkinstabilität, Schmerz,\neingeschränkte Belastbarkeit, Muskelverkürzung, Einsteifung\n§ Therapie: Arthrodese, Endoprothese"}, {"page": 57, "title": "Luxation                                                                       KLINIK", "text": "Luxation                                                                       KLINIK\n• Kontaktverlust der Gelenksflächen („Ausrenken“)\n§ direkte Krafteinwirkung auf das Gelenk mit Bänder- und Gelenkkapselriss\n§ indirekte Krafteinwirkung: Gelenkkopf wird über Hebelarm des Knochens aus der Gelenkspfanne herausgehebelt\n• z.B. Schultergelenksluxation\n§ Schultergelenk ist das beweglichste Gelenk mit geringer Stabilisierung\n§ bei Abduktion und Außenrotation\n§ Bewegungseinschränkung und Schmerzen\n§ Therapie: Reposition\nMoore et al., Clinically Oriented Anatomy, 2018"}, {"page": 58, "title": "Subluxation des Radiusköpfchens                                     KLINIK", "text": "Subluxation des Radiusköpfchens                                     KLINIK\nMoore et al., Clinically Oriented Anatomy, 2018"}, {"page": 59, "title": "Muskulatur        Trivia", "text": "Muskulatur        Trivia\nDer größte Muskel ist der 656                                                                    M. latissimus dorsi Muskeln                                                                                 (Fläche) bzw.\nM. gluteus maximus\n(Volumen). 30-50%\ndes Körpergewichts\nsind Muskelmasse                                                               Der stärkste Muskel ist\nder M. masseter.\nMuskeln 17\nDer längste Muskel ist benötigen wir zum Lächeln\nder M. sartorius.\nMuskeln 43                                                                Der kleinste Muskel ist benötigen wir zum\nder M. stapedius. grimmig Schauen\nMuskeln können nur ziehen,                                       Die aktivsten Muskeln sind\nnicht drücken!                                                     die äußeren Augenmuskeln."}, {"page": 60, "title": "ZUGMuskeln: Arten von Muskelgewebe", "text": "ZUGMuskeln: Arten von Muskelgewebe\nMuskelgewebe hat die Fähigkeit zur Kontraktion,\ndas heißt zur aktiven Verkürzung.\n• Quergestreifte Skelettmuskulatur\n§ Querstreifung im Licht- und Elektronenmikroskop\n§ Skelettmuskel, Zunge, kraniales Drittel des Oesophagus, Larynx, Pharynx\n§ willentlich steuerbar\n• Quergestreifte Herzmuskulatur\n§ Querstreifung im Licht- und Elektronenmikroskop\n§ Herzmuskel\n§ nicht willentlich beeinflussbar (autonom)\n• Glatte Muskulatur\n§ lichtmikroskopisch homogen (keine Querstreifung)\n§ Hohlorgane (Einengung des Lumens)\n§ nicht willentlich beeinflussbar\nWelsch, 2022"}, {"page": 61, "title": "Muskeln: Funktion von Skelettmuskulatur", "text": "Muskeln: Funktion von Skelettmuskulatur\n• Bewegung von Skelettelementen in ihren Gelenken\n• Stabilisierung der Gelenke\n• Energiespeicherung bei Dehnung\n• Dämpfung im Gelenk bei dynamischer Aktivität\n• Zuggurtung zur Reduzierung der Biegespannung"}, {"page": 62, "title": "Muskeln: Funktion von Skelettmuskulatur", "text": "Muskeln: Funktion von Skelettmuskulatur\n• Biegespannung\n§ durch nicht axiale Kraft\n§ bestehend aus Zug und Kompression\n• Zuggurtung\n§ Gegenkraft durch Muskeln und Bänder,\num Zugkomponente der Biegespannung\nzu reduzieren\n• Beispiel Femur – Tractus iliotibialis\n§ Körpergewicht biegt Diaphyse des\nFemurs nach lateral („Varus-Stress“)\n§ Tractus iliotibialis (aponeurotisch\nverstärkte Faszie des Oberschenkels)\nerzeugt Gegenspannung und reduziert\ndie Zugkraft"}, {"page": 63, "title": "Muskeln: Aufbau Muskelbauch & Sehne", "text": "Muskeln: Aufbau Muskelbauch & Sehne\n• mit Bindegewebe abgegrenzter Verband von Muskelfasern mit sehnigen Verbindungen\n§ Muskelbauch (Venter musculi)\n•  Baueinheit: Skelettmuskelfasern                                  ZUG\n(vielkernige Zellen, Durchmesser: 10-100 µm,\nLänge: bis zu 20 cm, Faserüberlappung & Faserketten)\n• Fasern verlaufen parallel oder schräg (gefiedert) zur Zugrichtung\n§ Sehne (Tendo musculi)\n• bindegewebige, bradytrophe Faserzüge, die den Muskelbauch mit dem Knochen verbinden\n• überträgt Zug, der durch die Muskelkontraktion\nentsteht, auf den Knochen\n§ Ursprung (Origo): proximale Anheftungsstelle\n§ Ansatz (Insertio): distale Anheftungsstelle\n§ Punctum fixum: Anheftungsstelle\nam unbewegten Skelettelement\n§ Punctum mobile: Anheftungsstelle\nam bewegten Skelettelement\nVisible Body App"}, {"page": 64, "title": "Muskeln: Muskeltypen", "text": "Muskeln: Muskeltypen\n• Anordnung der Muskelfasern\nparallelfaserig oder gefiedert\n• Anzahl der Muskelköpfe\neinköpfig, zweiköpfig, mehrköpfig\n• Anzahl der Muskelbäuche\neinbäuchig, zweibäuchig, mehrbäuchig\n• Anzahl der Gelenkbeteiligung\neingelenkig, zweigelenkig, ohne Gelenkbeteiligung\n• Form der Muskelbäuche\nplatt, spindelförmig, ringförmig, sägeförmig\nspindelförmig (M. palmaris longus), zweiköpfig (M. biceps femoris),\ndreiköpfig (M. triceps surae), vierköpfig (M. quadriceps femoris)\nzweibäuchig (M. omohyoideus), vielbäuchig (M. rectus abdominis),\nmehrsehnig (M. flexor digitorum profundus), Sägemuskel (M. serratus anterior)\ngefiedert (M. tibialis anterior), einfach gefiedert (M. semimembranosus),\nhalbsehnig (M. semitendinosus), platt (M. latissimus dorsi),\nringförmig (M. sphincter ani externus)"}, {"page": 65, "title": "ZUGMuskeln: Muskel & Muskelfaser", "text": "ZUGMuskeln: Muskel & Muskelfaser\n• Durchmesser einer Muskelfaser: 10-100 µm\n• Länge einer Muskelfaser: einige mm bis zu 20 cm\n• Fasern reichen nicht vom Ursprung bis zum Ansatz\n§ Faserüberlappung mit Entstehung eines Muskelbauchs\n§ Faserketten mit Zwischensehnen im Endomysium oder\nmyomyalen Kontakten, die End-zu-End oder\nEnd-zu-Seit verbunden sein können\n• Muskelspindeln\n§ Propriozeptoren: Rezeptoren der Tiefensensibilität, die\nInformationen über die Position und den Aktivitätszustand\nvon Muskeln liefern\nphysiologie.cc/M-S-Spindeln.jpg; Drenckhahn, Benninghoff Anatomie, 2008, Urban & Fischer"}, {"page": 66, "title": "Muskeln: Organisation in Faszien", "text": "Muskeln: Organisation in Faszien\n• Faszie\n§ straffes kollagenes Bindegewebe, das mit scherengitterförmigen Kollagenfasern den Muskel umgibt\n§ Form, Struktur, Schutz, reibungsarmes Gleiten, Übertragung von Muskelkraft\n§ Verhärtungen, Verklebungen, Verspannungen im Fasziennetz beeinflussen Befindlichkeit des gesamten\nKörpers und können unterschiedliche Beschwerden hervorrufen\n§ Einzelfaszie: umgibt einen einzelnen Muskel\n§ Gruppenfaszie: umgibt mehrere Muskeln\n• Muskellogen: Kompartimente aus Faszien, Septa intermuscularia und Membranae interosseae, die\nGruppen mehrerer, funktionell ähnlicher Muskeln zusammenfassen\n§ Körperfaszie: Bindegewebshülle aus festen Kollagenfasern, die die Muskeln gegen die Unterhaut abgrenzt,\nFascia cervicalis superficialis, Fascia thoracica externa, Fascia abdominalis superficialis, Fascia brachii,\nFascia antebrachii, Fascia lata, Fascia cruris, Fascia dorsalis pedis\nRauber Kopsch, Anatomie des Menschen, 2003, cdn.freshsurf.de/wp-content/uploads/2018/05/19113853/Faszienrolle.jpg ; image.jimcdn.com/app/cms/image/transf/none/path/sb528bc6c22f34e78/image/i018e98121db884f4/version/1478597339/image.jpg"}, {"page": 67, "title": "KLINIKMuskeln: Kompartmentsyndrom", "text": "KLINIKMuskeln: Kompartmentsyndrom\n• Anstieg des Gewebedrucks in (osteo)faszialen Logen (z.B. in Unterschenkel, Unterarm, Fuß), wodurch die Mikrozirkulation\nund neuromuskuläre Funktion beeinträchtigt werden\n§ Ätiologie: begleitend bei Traumata oder bei Überbelastung, andere Ursachen\n§ Pathogenese: Schwellung/Einblutung, Druckerhöhung, Störung des venösen Abflusses, Verminderung der arteriellen Versorgung, Circulus\nvitiosus, ischämische Nekrose von Muskeln und Nerven\n§ Symptome: Spannungsgefühl, Sensibilitätsstörung (Taubheitsgefühl, Kribbeln), bohrender Schmerz, Paralyse, Pulsverlust distal der\nbetroffenen Muskelloge\n§ Therapie: Entlastung, Kühlung, Dermatofasziotomie mit Sekundärnaht oder Hauttransplantation, Amputation\nJäger & Zeichen, Operative Techniken, 2011; Echtermeyer & Horst, Unfallchirurg, 1997"}, {"page": 68, "title": "Muskeln: Tendines (Sehnen)", "text": "Muskeln: Tendines (Sehnen)\n• Verbindung von Muskel und Knochen aus straffem, parallelfaserigem\nBindegewebe\n§ reißfest und elastisch\n§ nur wenige Nerven und Blutgefäße (bradytroph)\n• Peritendineum\n§ Sehnenhaut aus lockerem, fibrösem, blutgefäß- und\nnervenführendem Bindegewebe\n• Sehnenspindel (Golgi-Sehnenorgan)\n§ Propriorezeptoren am Übergang zwischen Sehne und Muskel\n• Kraftübertragung\n§ überträgt Zug, der durch die Muskelkontraktion entsteht, auf Knochen\n• Sehnenformen\n§ strangförmig\n§ flächige Sehnenplatten (Aponeurose)\n§ fleischig (makroskopisch nicht sichtbar)\n§ Zwischensehnen\nDie stärkste Sehne ist der Tendo                                                                                         calcaneus,                                                 bekannt als                                                                    Achillessehne, mit der der M. triceps                                                            surae am                                                                     Fersenbein                                                                                         ansetzt."}, {"page": 69, "title": "Muskeln: Sehnentypen", "text": "Muskeln: Sehnentypen\n• Zugsehne\n§ auf Zug beansprucht\n§ Zugrichtung entspricht der des Muskels\n• Gleit- (Druck)sehne\n§ auf Zug und Druck beansprucht\n§ ziehen um ein Hypomochlion (Knochen oder andere Struktur)\nherum und ändern so ihre Richtung\n§ nicht vaskularisierter Faserknorpel auf der dem Knochen\nzugewandten Seite"}, {"page": 70, "title": "Muskeln: Hilfsstrukturen von Muskeln und Sehnen", "text": "Muskeln: Hilfsstrukturen von Muskeln und Sehnen\n• Faszien\n• Schleimbeutel\n• Sesambeine\n• Sehnenscheiden\n• Retinacula"}, {"page": 71, "title": "Hilfsstrukturen: Ossa sesamoidea", "text": "Hilfsstrukturen: Ossa sesamoidea\n• in Sehnen eingelagerte Knochen\n• Funktionen\n§ schützen vor zu großer Reibung\n§ können als Hypomochlien wirken\n• Hypomochlion\n• Widerlager, das Muskeln bzw. Sehnen umlenkt\n• Knochenkanten und -vorsprünge, Sesambeine\n• verlängern Hebelarm, was den Kraftaufwand verringert\n• variabel in Anzahl und Ausprägung\n• Beispiele\n§ Patella\n§ Os pisiforme"}, {"page": 72, "title": "Hilfsstrukturen: Vaginae tendinum (Sehenscheiden)", "text": "Hilfsstrukturen: Vaginae tendinum (Sehenscheiden)\n• röhrenförmiges Gebilde, die Sehnen dort umgeben, wo sie direkt am\nKnochen verlaufen, umgelenkt oder geführt werden\n• Funktionen\n§ verbessern Gleitfähigkeit\n§ schützen Sehnen                                         KLINIK\n§ führen Sehnen\n• Tendovaginitis\n§ Entzündung der Muskelsehnen und Sehnenscheiden\n§ Ursachen\n• Überbelastung, Fehlhaltung, stereotyper\nBewegungsablauf\n•  postinfektiös, wenn gebildete Antikörper\nauf körpereigenes Gewebe reagieren\n•  bakterielle Infektion\n§ Symptome\n• typische Entzündungszeichen:\nRötung, Schwellung, Schmerz, Überwärmung, eingeschränkte Funktion\n§ Therapie\n•  Ruhigstellung (Schiene, Verband, Tape, Gips)\nBeispiel:\n• operative Öffnung des Retinakulums                                                                                                         karpale & digitale Sehnenscheiden"}, {"page": 73, "title": "Hilfsstrukturen: Retinacula", "text": "Hilfsstrukturen: Retinacula\n• bindegewebige Haltebänder\n• Funktionen\n§ halten und führen Sehnen\n§ verhindern, dass Sehnen (bei Muskelkontraktion) von\nder typischen Verlaufsrichtung abgelenkt werden\nBeispiel:                                                 Beispiel:\nRetinaculum m. extensorum superior/inferior                Retinaculum m. flexorum"}, {"page": 74, "title": "Muskeln: Bewegungs- & Haltemuskulatur", "text": "Muskeln: Bewegungs- & Haltemuskulatur\n• Fasertypen  ZUG\n§ Slow-Twitch-Fasern (Typ I): langsam zuckend für Dauerleistung mit großer Ermüdungsresistenz\n§ Fast-Twitch-Fasern (Typ II): schnell zuckend für schnelle, kraftvolle Kontraktionen, aber höhere Ermüdbarkeit\n• Weiße Bewegungsmuskulatur\n§ überwiegend schnelle Typ II Fasern\n§ weniger kapillarisiert\n§ kleine motorische Einheiten\n§ neigen zur Atrophie > regelmäßige Kräftigung\n§ z.B. M. biceps brachii, M. gluteus maximus\n• Rote Haltemuskulatur\n§ überwiegend langsame Typ I Fasern\n§ sehr gute Blutgefäßversorgung\n§ große motorische Einheiten\n§ neigen zur Verkürzung > regelmäßige Dehnung\n§ z.B. M. iliopsoas, M. erector spinae"}, {"page": 75, "title": "Muskelkontraktion: Zusammenspiel der Muskeln", "text": "Muskelkontraktion: Zusammenspiel der Muskeln\n• Agonisten: führen gewünschte Bewegung aus\n• Antagonisten: wirken dieser Bewegung entgegen\n• Synergisten: unterstützen Agonisten\n§ direkte Synergisten\n§ indirekte Synergisten\n• z.B. Flexion im Ellenbogengelenk\n§ Agonist: M. biceps brachii\n§ Synergist: M. brachialis, M. brachioradialis\n§ Antagonist: M. triceps brachii, M. anconeus\n§ indirekte Synergisten: M. teres major, M. latissimus dorsi\nyoutu.be/sur3UGBJBAg"}, {"page": 76, "title": "Muskelkontraktion: Arten", "text": "Muskelkontraktion: Arten\n• Ruhetonus\n§ Spannungszustand durch neuronale Dauererregung\n§ durch Muskelspindeln reguliert\n• isometrische Kontraktion\n§ erhöhte Spannung im Agonisten\n§ aber gleichbleibende Länge der Muskelfasern\n§ Haltefunktion und Vorbereitung (am Beginn) einer Bewegung\n• isotonische Kontraktion\n§ Spannung im Agonisten bleibt annähernd gleich\n§ Muskelfasern verkürzen sich\n§ es kommt zur sichtbaren Bewegung\n§ kommt in der Realität kaum vor\n• auxotonische Kontraktion\n§ während der Bewegung ändern sich sowohl Muskellänge als auch Spannung, z.B.\ndurch wechselnde Hebelverhältnisse\n•  konzentrisch: Muskel verkürzt sich (erzeugtes Drehmoment ist größer als\nWiderstand)\n•  exzentrisch: Muskel verlängert sich (erzeugtes Drehmoment ist kleiner als\nWiderstand), z.B. “nachgebendes“, langsames Absenken\nBetts et al., 2017, Anatomy and Physiology, openstax"}, {"page": 77, "title": "Muskelmechanik: Muskelkraft & Verkürzungsvermögen", "text": "Muskelmechanik: Muskelkraft & Verkürzungsvermögen\n• Muskelkraft (Kontraktionskraft) FM\n§ abhängig vom Muskelquerschnitt AP\n§ Muskelquerschnitt\n• anatomisch (AA)\n• senkrecht zur Hauptachse\n• physiologisch (AP)\n• senkrecht zu Muskelfasern\n• AP = AA / cos θ\n•  parallelfaserige Muskeln: AP = AA\n•  gefiederten Muskeln: AP > AA\n• Sehnenkraft (Hubkraft) FS                                          FM              θ\n§ auf die Sehne übertragene Muskelkraft       =                                                              FM    FS\n§ FS = FM . cos θ                            FS                                                                                                 Pf                 Pf\n§ gefiederte Muskeln können weniger der                                                                                                                                                                                       l2\nKontraktionskraft auf die Sehne übertragen, ihre\nFS ist in der Praxis trotzdem größer als die von                                                                                                                                                                                                          l1       l2       parallelfaserigen, weil ihre FM deutlich größer ist                                                                  Gefiederte Muskeln                               H                                                                             kompensieren                                                        l1  θ                                                                    eine niedrigere   • Hubhöhe H                                                                 Kraftausbeute            H                                                            durch höhere                                                                              Kraftentwicklung als\n§ physiologisches Verkürzungsvermögen                              parallelfaserige Muskeln.\nPm          Pm       § H = l1 . cos θ1 – l2 . cos θ2\n§ kann bei geeignetem Fiederungswinkel zu größerer Hubhöhe als bei parallelfaserigen Muskeln führen"}, {"page": 78, "title": "Muskelmechanik: Muskelwirkung an Gelenken", "text": "Muskelmechanik: Muskelwirkung an Gelenken\n• da eine Sehne nicht senkrecht sondern in einem Winkel am Knochen ansetzt, sind nur Teile der Hubkraft bzw. des Hebels\ntatsächlich für die Bewegung wirksam\n§ rotatorische Kraftkomponente (wirkende Sehnenkraft FS‘)\n•  vektorielle Kraftkomponente, die senkrecht zum Hebelarm angreift\n•  ist vom Sehnenansatzwinkel α abhängig\n• Kraftkomponente, die zu sichtbaren Bewegungen im Gelenk führt\n§ longitudinale Kraftkomponente\n•  vektorielle Kraftkomponente, die longitudinal zum Hebelarm angreift\n• Kraftkomponente, die aufs Gelenk bzw. den Knochen wirkt\n(z.B. Zentrierung des Gelenkkopfs in der Gelenkspfanne, Zuggurtung)\n§ wirksamer Hebelarm\n•  ist die senkrechte Strecke von der Drehachse zur\nMuskelsehne bzw. zum Angriffspunkt der Last\n• Größe und Richtung dieses „virtuellen“ Hebelarms\nist abhängig von der Stellung des Gelenks"}, {"page": 79, "title": "Muskelmechanik: Muskelwirkung an Gelenken", "text": "Muskelmechanik: Muskelwirkung an Gelenken\n• Muskelmoment wirkt gegen Lastmoment\n§ MM = FS . av  und  ML = FL . bv\n§ MM > ML führt zu Bewegung von Punctum mobile zu Punctum fixum\n§ bis zu einer Gelenkstellung von 90° werden dabei av und bv größer, somit werden beide M auch bei konstanten F größer\n§ bei Weiterführung der Bewegung wird bv kleiner, somit nimmt das ML ab\n§ je nach Verlauf und Ansatz des Muskels, kann av vorerst immer noch zunehmen, wodurch das MM auch bei konstanter FS weiter zunimmt\n§ Vorteil: ohne Steigerung von FS wird MM größer, während ML abnimmt\n§ erst nach Erreichen des maximalen av nimmt bei konstanter FS auch MM wieder ab"}, {"page": 80, "title": "Muskelmechanik: Muskelinsuffizienz", "text": "Muskelmechanik: Muskelinsuffizienz\n• aktive Insuffizienz\n§ volle Verkürzung des Muskels nicht möglich, obwohl im Gelenk noch\nnicht die maximal mögliche Endstellung erreicht ist\n§ bei eingelenkigen Muskeln pathologisch, physiologisch typisch bei\nzweigelenkigen Muskeln\n§ z.B. ischiokrurale Muskulatur kann das Kniegelenk nicht vollständig\nbeugen, wenn das Hüftgelenk vollständig gestreckt ist, da diese\nMuskeln auch für die Extension im Hüftgelenk zuständig sind; erst\nbei Flexion im Hüftgelenk wird eine größere Verkürzung (Hubhöhe)\nund somit eine weitere Flexion im Kniegelenk möglich\n• passive Insuffizienz\n§ unzureichende Dehnungsfähigkeit von Antagonisten eines Muskels\nverhindert dessen weitere konzentrische Kontraktion\n§ bei eingelenkigen Muskeln pathologisch, bei mehrgelenkigen\nMuskeln auch physiologisch\n§ z.B. Schließen der Faust ist bei endgradiger Palmarflexion\nkaum möglich, weil die Fingerextensoren nicht die nötige\nFlexibilität aufweisen"}, {"page": 81, "title": "Übersicht über Leitungsbahnen", "text": "Übersicht über Leitungsbahnen\n• anatomische Strukturen zur Weiterleitung von Körperflüssigkeiten oder elektrischer Erregung\nNerven                       Lymphgefäße                         Blutgefäße"}, {"page": 82, "title": "HKA  ZUGKardiovaskuläres System", "text": "HKA  ZUGKardiovaskuläres System\n• Funktionen\n§ Bluttransport\n§ Versorgung mit Sauerstoff und Nährstoffen\n§ Abtransport von CO2 und Stoffwechselprodukten\n§ allgemeiner Transport (Hormone, Gerinnungsfaktoren, Abwehrzellen,…)\n§ Thermoregulation\n• Bauplan\n§ Herz (Cor): muskuläre Druck- und\nSaugpumpe mit 2 Kammern und 2 Vorhöfen\n§ Blutkreislauf: Röhrensystem aus Blutgefäßen\n(Arterien, Kapillaren und Venen)\n• Vasa publica: Gefäße für Funktionen,\ndie dem gesamten Kreislauf bzw. Körper\ndienen (z.B. Aorta, Vv. cavae)\n• Vasa privata: Gefäße zur Eigenversorgung\neines Organs (z.B. Aa. und Vv. coronariae)"}, {"page": 83, "title": "Kardiovaskuläres System: Kreislauf", "text": "Kardiovaskuläres System: Kreislauf\n• Lungenkreislauf\n§ Ventriculus dexter (Blut: O2- und CO2+)                  Kollateralkreislauf:\nUmgehungskreislauf über       § Truncus pulmonalis, Aa. pulmonales                                                                                  alternative                                            Gefäße (z.B.                                                              physiologisch im Bereich       § Pulmo (Blut: O2+ und CO2-)                   von Gelenken, bei                                                                      Verschluss                                                        eines Gefäßes       § Vv. pulmonales                                                      vorteilhaft)\n§ Atrium sinistrum\n• Körperkreislauf\n§ Ventriculus sinister (Blut: O2+ und CO2-)\n§ Aorta (Aorta ascendens, Aortenbogen, Aorta\ndescendens: Pars thoracica, Pars abdominalis)\n§ Körper (Blut: O2- und CO2+)\n§ Vv. cavae sup. & inf.\n§ Atrium dextrum\n§ Portales Venensystem\n• Magen, Darm, Pankreas, Milz\n•  V. portae hepatis\n• Hepar (Verstoffwechselung)\n• Vv. hepaticae\n•  V. cava inferior"}, {"page": 84, "title": "Kardiovaskuläres System: Wandbau von Blutgefäßen", "text": "Kardiovaskuläres System: Wandbau von Blutgefäßen\n• Aufbau\n§ Tunica intima\n•  längsgerichtete Endothelzellen auf Basalmembran\n• Membrana elastica interna (nur bei Arterien des muskulären Typs)\n•  Stoff-, Flüssigkeits- und Gasaustausch\n§ Tunica media\n•  zirkulär angeordnete glatte Muskelzellen\n•  elastische und kollagene Fasern\n• Membrana elastica externa (nur bei Arterien des muskulären Typs)\n• Regulation des Blutflusses\n§ Tunica adventitia\n•  längsgerichtetes kollagenes Bindegewebe\n• Verankerung in Umgebung"}, {"page": 85, "title": "Kardiovaskuläres System: Arterien & Venen", "text": "Kardiovaskuläres System: Arterien & Venen\n• Arterien („Pulsader“, „Schlagader“)             ACHTUNG! kein anatomisch\nkorrekter Terminus!\n§ Blutgefäße, die das Blut vom Herzen wegführen                                                  Vasodilatation:                                                                                                        Vergrößerung des\n•  elastischer Typ (A. elastotypica): viele elastische Fasern in der Media, kurze                   Lumens eines                                                                                                                  Blutgefäßes\nEnergiespeicherung durch Wanddehnung bei Systole, dadurch wird pulsatiler                  Vasokonstriktion:                                                                                                     Verengung des          Blutfluss kontinuierlicher (Aorta und herznahe Gefäße)                                   Lumens eines                                                                                                                  Blutgefäßes\n• muskulöser Typ (A. myotypica): Blutdruckregulation durch Vasokonstriktion\n•  Sperrarterien: können Blutfluss von nachgeschalteten Bereichen reduzieren\noder verhindern (z.B. Schwellkörper des Penis bzw. der Klitoris)\n• Venen\n§ Blutgefäße, die das Blut zum Herzen zurückführen\n• weniger muskulös als Arterien\n• Venenklappen (Ausklappungen der Intima)\n• arteriovenöse Kopplung\n• Muskelpumpe\n• Sogwirkung des Herzens\n• Druckunterschiede beim Atmen\n• Vv. profundae & Vv. superficiales\n• Vv. comitantes („Begleitvenen“) verlaufen häufig mit Arterien\n• Drosselvenen: können Blutfluss aus dem Kapillargebiet oder vorgeschalteten\nKapazitätsvenen reduzieren oder verhindern (z.B. Darmschleimhaut)"}, {"page": 86, "title": "Kardiovaskuläres System: Arterien & Venen", "text": "Kardiovaskuläres System: Arterien & Venen"}, {"page": 87, "title": "Kardiovaskuläres System: Terminale Strombahn", "text": "Kardiovaskuläres System: Terminale Strombahn\n• Stoff- und Gasaustausch, Flüssigkeitsverschiebung\n§ Arteriolen\n§ Metarteriolen\n§ Kapillaren mit Sphinkter\n§ Venolen\n• Sinusoide: kapillarähnliches Blutgefäß mit diskontinuierlichem\nEndothel ohne Basallamina\n§ endokrine und lymphatische Gewebe, Leber\n§ Übertritt von Makromolekülen zwischen Gewebe und Blut\n• Lymphgefäßsystem: etwa 2 % der Flüssigkeit wird über\nLymphsystem wieder aufgenommen\n• arteriovenöse Anastomose: Verbindung zw. arteriellem und\nvenösem Blutgefäß ohne Kapillarbett\n§ Wärmeregulation\n§ Regulation der Organdurchblutung\n§ Regulation des Blutdrucks"}, {"page": 88, "title": "Kardiovaskuläres System: die großen Blutgefäße des Körpers", "text": "Kardiovaskuläres System: die großen Blutgefäße des Körpers\nA. iliaca communis"}, {"page": 89, "title": "BUI  ZUGLymphatisches System", "text": "BUI  ZUGLymphatisches System\n• Funktionen des Lymphgefäßsystems\n§ Flüssigkeitsdrainage aus dem Interstitium als Lymphe\n§ Abtransport von im Darm resorbiertem Fett als Chylus\n§ Transport von Lymphozyten von lymphatischen Organen ins Blut\n• Aufbau des Lymphgefäßsystems\n§ Vasa lymphocapillaria: Lymphkapillaren beginnen als\nblinde Röhren im Interstitium\n§ Lymphkollektoren\n§ Vasa lymphatica: Lymphgefäße mit venenartigem Wandbau\n§ Trunci lymphatica (Lymphstämme)\n•  Trunci lumbales, Trunci intestinales, Trunci bronchomediastinales,\nTrunci subclavii, Trunci jugulares\n§ Ductus thoracicus & Ductus lymphaticus dexter (Lymphgänge)\n§ Cisterna chyli: Erweiterung am kaudalen Ende des Ductus thoracicus\n§ Nodus lymphaticus: Lymphknoten als Filterstation für Antigene\n•  regionärer Lymphknoten: erhalten Lymphe aus einer bestimmten Region\n• Sammellymphknoten\n• Lymphatische Organe\n§ Knochenmark, Thymus, Milz, Lymphknoten, Tonsillen, GALT\n§ bilden, differenzieren, vermehren oder beinhalten Lymphozyten für die Immunabwehr"}, {"page": 90, "title": "NES  HUS  ZUGNervensystem", "text": "NES  HUS  ZUGNervensystem\n• Funktionen\n§ Reizaufnahme, -weiterleitung, -verarbeitung, -beantwortung\n§ Steuerung von Muskulatur und Eingeweide\n§ Kommunikation mit Umwelt & Körperinnerem\n§ Anpassung des Körpers an Umwelt & Körperinneres\n§ komplexe Funktion wie Gedächtnis, Denken, Emotionen,…"}, {"page": 91, "title": "Nervensystem: Gliederung", "text": "Nervensystem: Gliederung\n• Topographische Gliederung\n§ Zentrales Nervensystem (ZNS)\n• Gehirn (Encephalon oder Cerebrum)\n• Rückenmark (Medulla spinalis)\n§ Peripheres Nervensystem (PNS)\n• Hirnnerven und Spinalnerven\n•  Spinalganglien & autonome Ganglien\n(Ansammlung von Nervenzellkörpern außerhalb des ZNS)\n• periphere Nerven: motorische, sensible & autonome Nervenfasern\n• Funktionelle Gliederung\n§ Somatisches Nervensystem\n• Kommunikation mit der Umwelt\n• bewusste Wahrnehmung und Verarbeitung von Reizen (Sensibilität)\n• Steuerung der Skelettmuskulatur (Motorik)\n§ Autonomes (viszerales, vegetatives) Nervensystem\n•  steuert weitgehend unbewusst die Funktionen der inneren Organe\n• Sympathikus (Innervation von Funktionen, die den Körper in erhöhte\nLeistungsbereitschaft versetzen und Energie verbrauchen)  „fight or                                                                              flight“\n• Parasympathikus (Innervation von Funktionen zur Regeneration\ndes Körpers und Aufbau von Energiereserven)             „rest and digest“\n• Enterales Nervensystem (Regulierung der Darmaktivität)                                                       „Gehirn des Darms“"}, {"page": 92, "title": "Nervensystem: Informationsflüsse", "text": "Nervensystem: Informationsflüsse\n• Richtungen des Informationsflusses\n§ Afferenzen\n•  Zuflüsse von Informationen\n• aus der Peripherie zum ZNS (sensibel)\n§ Efferenzen\n• Wegleitung von Informationen\n• vom ZNS in die Peripherie (motorisch = steuernd)\nAfferent und sensibel bzw. efferent und motorisch\nwerden häufig synonym verwendet, was in Bezug auf\nZu- und Abgänge des ZNS im weitesten Sinne korrekt ist.\nABER! Innerhalb des ZNS kann eine Nervenfaser\nje nach Bezugspunkt afferent und efferent sein, z.B.\nFaserbahnen, die sensible Information vom Thalamus\n(„Tor zum Bewusstsein“) zur Großhirnrinde leiten, sind\nafferent für den Cortex (Zufluss von Informationen)\naber efferent für den Thalamus (Wegleitung von\nInformationen)."}, {"page": 93, "title": "Nervensystem: Faserqualitäten peripherer Nerven", "text": "Nervensystem: Faserqualitäten peripherer Nerven\n• somatomotorische Fasern                                                 • allgemein somatosensible Fasern\n§ efferente Fasern zur Innervation von Skelettmuskulatur                         § afferente Fasern, die Reize wie Schmerz, Temperatur, Druck,\nVibration aus Haut, Gelenken und Skelettmuskulatur\nweiterleiten\n• speziell somatosensible Fasern\n§ afferente Fasern, die spezielle somatische (sensorische)\nSinnesinformationen leiten (Sehen, Hören, Gleichgewicht)\n• allgemein viszeromotorische Fasern                                   • allgemein viszerosensible Fasern\n§ efferente Fasern des autonomen Nervensystems zur                            § afferente Fasern aus Eingeweiden, Gefäßen, Drüsen, die\nInnervation von glatter Muskulatur (Gefäße, Eingeweide),                 Informationen über Dehnung, chemische Reize, Durchblutung,…\ndes Herzens und von Drüsen                                                weiterleiten (meist ohne bewusste Wahrnehmung)\n• speziell viszeromotorische Fasern                                      • speziell viszerosensible Fasern\n§ efferente Fasern zur Innervation von Muskeln, die aus                           § afferente Fasern für spezielle viszerale (sensorische) Sinne\nSchlundbögen hervorgegangen sind                                  (Geschmack, Geruch)\n(entsprechen funktionell den somatomotorischen Fasern)"}, {"page": 94, "title": "Nervensystem: «Fühlen»", "text": "Nervensystem: «Fühlen»\n• Sensibilität\n§ bewusste und unbewusste körperliche Wahrnehmungen mechanischer, thermischer\noder chemischer inklusive Schmerz Reize, die über afferente Nervenfasern aus der\nKörperperipherie zum ZNS geleitet und dort verarbeitet werden\n§ Ort der Reizentstehung\n• Exterozeption (Oberflächensensibilität*): Wahrnehmung von äußeren Reizen\nüber Haut und körperöffnungsnahe Schleimhaut (z.B. Berührung, Schmerz)\n• Propriozeption (Tiefensensibilität): Wahrnehmung von Reizen aus dem\nBewegungsapparat (Position & Aktivitätszustand von Gelenken, Muskeln & Sehnen)\n•  Interozeption: Wahrnehmung von Reizen aus dem Körperinneren\n(z.B. Hunger, Durst, Müdigkeit, Atemnot, Blutdruck)\n• Viszerozeption: aus inneren Organen (z.B. Blasendehnung, Darmkolik)\n§ Art des vermittelten Reizes\n• protopathisch: Grobwahrnehmung von Schmerz und Temperatur (Schutzwirkung)\n* Streng genommen                                                                                                                                                 beinhaltet           •  epikritisch: Feinwahrnehmung von Druck, Berührung, Vibration (Differenzierung)                                                                                                                                                alle                        Exterozeption                                                                                                                   Umweltreize (taktile, visuelle, auditive,       § Art des Reizes                                                                                                     olfaktorische und                                                                                                                                                 gustatorische), während                                                                                                                              Oberflächensensibilität                                                                                                                                                               klinisch enger gefasst           • mechanisch: Berührung, Druck, Vibration, Dehnung                                                              ist                                                                                                 und sich nur auf taktile                                                                                                                                             Hautreize                                                                                                                                                                  bezieht.                                                                                                                                                                             In                                                                                                              der klinischen Praxis werden                                                                                                                                        beide           • thermisch: Kälte und Wärme                                                                                                                                                                Begriffe                                                                                                                               häufig synonym                                                                                                                                      verwendet.\n•  nozizeptiv: Schmerz\n• chemisch: pH-Wert, Sauerstoff- oder Kohlendioxidkonzentration, Osmolalität"}, {"page": 95, "title": "ZUGNervensystem: Zellen", "text": "ZUGNervensystem: Zellen\n• Neurone                                                            NEURONALE POLARITÄT\nklare Richtung der Informationsverarbeitung       § hoch spezialisierte Zellen des Nervensystems, die Erregung bilden,\nvon dendritischen Eingängen über das Soma\nleiten und verarbeiten können (chemisch und elektrisch)\nzum axonalen Ausgang\n§ Aufbau\n• Perikaryon = Soma (Zellkörper)\n• metabolische Zentrale und Verrechnungsstation\n• Dendriten\n•  viele, verzweigte Zellfortsätze zur Oberflächenvergrößerung\n•  Kontaktstellen für Synapsen\n• nehmen chemische Impulse auf (Afferenzen) und leiten sie\nelektrisch ans Soma weiter\n• Axon (Neurit)\n•  (meist ein) langer Zellfortsatz\n• Axonhügel: Entstehung eines Aktionspotenzials\n• Axonsegmente: kann myelinisiert sein, um\nLeitungsgeschwindigkeit zu erhöhen\n• Axonterminale für synaptische Kontakte\n•  leiten elektrische Impulse an Zielzelle (Neuron, Muskel-, Drüsenzelle)\n§ funktionelle Typen (abhängig v

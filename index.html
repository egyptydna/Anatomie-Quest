om Neurotransmitter)\n•  exzitatorisch: fördert Erregung der Zielzelle (z.B. durch Glutamat)\n•  inhibitorisch: hemmt Erregung der Zielzelle (z.B. durch GABA)"}, {"page": 96, "title": "Nervensystem: Zellen", "text": "Nervensystem: Zellen\n• Gliazellen                                                                           • Neurone\n§ nicht-erregbare Zellen des Nervensystems, die Neuronen                           § marklose Nervenfasern\nstrukturell, funktionell und metabolisch unterstützen                                                                                                              § markhältige Nervenfasern\n§ im PNS                                                                                                                           • von Schwann-Zellen (PNS) umwickelt, sodass sich\n• Schwann-Zellen                                                        Lamellen entwickeln, die Myelin enthalten\n(Myelin- oder Markscheide)               •  bildet Myelinscheide um ein Axon (auch nicht-myelinisierend)\n•  Myelin: fetthaltige Substanz, die die elektrische Kapazität               •  elektrische Isolation und Regeneration\nverringert und den elektrischen Widerstand erhöht\n• Mantelzellen\n• Ranvier-Schnürring: Unterbrechung der Myelinscheide\n• umgeben Somata von Neuronen in Ganglien                                                                             zwischen zwei Schwann-Zellen\n§ im ZNS                                                                                                                           • Internodium: Abschnitt zwischen zwei Ranvier-\n• Astrozyten                                                             Schnürringen\n•  Regulation von Stoffwechsel, Neurotransmittern,…\n• Oligodendrozyten\n•  bilden Myelinscheiden um mehrere Axone\n(auch nicht-myelinisierend)\n•  elektrische Isolation\n•  Mikroglia\n• „Immunzellen“ des ZNS\n• Ependymzellen\n•  bilden Liquor cerebrospinalis"}, {"page": 97, "title": "Nervensystem: Verschaltungsmuster", "text": "Nervensystem: Verschaltungsmuster\n• Divergenz (a)\n§ ein Neuron sendet Signale an viele nachgeschaltete Zielzellen\n§ Signalverteilung, -verstärkung\n§ z.B.: ein Motoneuron verzweigt sich auf mehrere Muskelfasern\n• Konvergenz (b)\n§ ein Neuron erhält Signale von vielen vorgeschalteten Zellen\n§ Signalbündelung, Informationsintegration\n§ z.B.: eine Purkinje-Zelle im Cerebellum erhält Eingänge von bis zu\n100.000 Neuronen zur Integration und Filterung\n• rekurrente Hemmung (c)\n§ ein Neuron hemmt sich indirekt selbst, indem es ein Interneuron\naktiviert, das hemmend auf das Ursprungneuron wirkt\n§ Aktivitätskontrolle\n§ z.B.: Motoneuron im Rückenmark aktiviert Renshaw-Zelle, die dieses\nund benachbarte Motoneurone hemmt, um Übererregung zu verhindern\n• laterale Hemmung (d)\n§ ein Neuron hemmt über ein Interneuron benachbarte Neurone\n§ Kontrastverstärkung, Reizschärfung\n§ z.B.: ein Fotorezeptor der Retina aktiviert ein Interneuron, das\nnachgeschaltete Zellen von benachbarten Fotorezeptoren hemmt,\nwodurch Kontraste verstärkt und die Bildschärfe erhöht wird"}, {"page": 98, "title": "Nervensystem: Erregungsweiterleitung", "text": "Nervensystem: Erregungsweiterleitung\n• Membran(ruhe)potential\n§ unterschiedliche Konzentration von Ionen an der Außen- und Innenseite der Zellmembran führt zu einer Spannung von etwa - 70-80 mV\n§ wird durch Na+/K+ ATPase in der Membran aufrechterhalten\n§ kann durch ankommendes exzitatorisches oder inhibitorisches Signal\ndepolarisieren oder hyperpolarisieren\n§ Summe der ankommenden Signale bewirkt gegebenenfalls ein …\n• Aktionspotential\n§ kurze Änderung des Membranpotentials zur elektrischen Reizleitung\n• Depolarisation\n(Na+ Kanäle öffnen, Na+ Einstrom, Zellinneres wird positiv)\n• Repolarisation\n(Na+ Kanäle schließen, K+ Kanäle öffnen, K+ Ausstrom)\n• Hyperpolarisation\n(K+ Kanäle noch offen, Potential kurz unter Ruhepotential)\n• Rückkehr zum Ruhepotential durch Na+/K+ Pumpe\n§ Aktionspotential breitet sich dem Axon entlang aus\n§ saltatorische Erregungsleitung\n• Erregungsleitung in Sprüngen von einem zum nächsten\nRanvier‘schen Schnürring\n• Erhöhung der Leitungsgeschwindigkeit im Vergleich\nzu marklosen Fasern"}, {"page": 99, "title": "Nervensystem: Erregungsweiterleitung", "text": "Nervensystem: Erregungsweiterleitung\n• Synapse\n§ funktionelle Verbindung zwischen Neuron und Erfolgsorgan\n§ Art der Informationsübertragung\n•  elektrische Synapse (Gap Junction, Nexus): Übertragung eines Signals\n(Ionenfluss) zwischen eng aneinander liegenden Zellen über\nporenbildende Proteinkomplexe in den Plasmamembranen\n• chemische Synapse: Übertragung eines Signals zwischen zwei Zellen\nüber einen synaptischen Spalt mit Hilfe eines Neurotransmitters\n§ Art des Signals\n•  exzitatorisch: fördert Depolarisation,\nz.B. Glutamat, Acetylcholin\n•  inhibitorisch: fördert Hyperpolarisation,\nz.B. GABA (!-Aminobuttersäure), Glycin\n§ Kontaktort an Zielzelle\n• axodendritisch\n• axosomatisch\n• axoaxonisch\n• dendrodendritisch\n§ Zielstruktur\n• Neuron\n• Muskelfaser (neuromuskuläre Endplatte)\n•  Drüsenzelle\nBehrends et al., Duale Reihe Physiologie, Thieme, 2021; Aumüller et al., Anatomie, Thieme, 2020"}, {"page": 100, "title": "Nervensystem: Innervation von Muskelfasern", "text": "Nervensystem: Innervation von Muskelfasern\n• Motorische Einheit\n§ ein Motoneuron mit allen davon innervierten Muskelfasern\n§ alle Fasern einer Einheit kontrahieren gleichzeitig\n§ Axon verzweigt sich, verliert Markscheide und endet terminal\nin mehreren motorischen Endplatten\n§ ein Axon erreicht einige bis zu 1000 Muskelfasern\n• Motorische Endplatte (neuromuskuläre Synapse)\n§ Übertragung des Aktionspotentials des Axonterminals eines\nMotoneurons und Sarkolemm einer Muskelfaser\n§ präsynaptische Membran mit synaptischen Vesikeln:\nNeurotransmitter Acetylcholin wird freigegeben in den\n§ synaptischen Spalt\n§ postsynaptische Membran: ist durch Einfaltungen des\nSarkolemms vergrößert und enthält Acetylcholin-\nRezeptoren, die Acetylcholin binden (> Rezeptorpotential >)\n§ Aktionspotential: Erregung der Muskelfaser\n§ Kontraktion der Muskelfaser"}, {"page": 101, "title": "Nervensystem: Zentralnervensystem (ZNS)", "text": "Nervensystem: Zentralnervensystem (ZNS)\n• Substantia grisea (Graue Substanz)\n§ hauptsächlich Ansammlung von Nervenzellkörpern\n§ Neuropil: Netzwerk aus nicht-myelinisierten Axonen, Dendriten, Synapsen\nund Gliazellfortsätze zwischen den Somata der Neurone\n§ hier kommt es zu synaptischen Verschaltungen und Informationsverarbeitung\n§ Cortex cerebri/cerebelli, Nuclei cerebri/cerebelli, Medulla spinalis\n§ PNS: Ganglien\n• Substantia alba (Weiße Substanz)\n§ überwiegend myelinisierte Axone\n§ hier kommt es zur Signalweiterleitung über längere Distanzen\n§ Assoziations- und Projektionsbahnen, Kommissuren, Medulla spinalis\n§ PNS: peripherer Nerv\nBEACHTE: Im Gehirn liegt die graue Substanz (Cortex) außen um die weiße\nSubstanz herum (in der Tiefe gibt es graue Substanz auch als Kerngebiete), im\nRückenmark liegt die weiße Substanz außen um die graue Substanz herum."}, {"page": 102, "title": "Nervensystem: ZNS – Rückenmark", "text": "Nervensystem: ZNS – Rückenmark\nHinterstrang\n• Substantia grisea (Graue Substanz)\n§ Cornu posterius (Hinterhorn)\n• Somata von Projektions- und Interneuronen\n•  hier enden afferente Fasern von Neuronen, deren                           Seitenstrang\nSomata in Spinalganglien liegen\n§ Cornu anterius (Vorderhorn)\n• Somata von Moto- und Interneuronen\n• von hier ziehen efferente Fasern in die Peripherie\n§ Substantia intermedia                                                                                                          Vorderstrang\n• Commisura grisea mit Canalis centralis\n• Cornu laterale (Seitenhorn)\n• nur im thorakalen und oberen lumbalen Abschnitt (Th1–L2/L3)\n• Somata von viszeromotorischen (sympathischen) Neuronen\n• von hier ziehen präganglionären Fasern zu vegetativen Ganglien\n(von dort postganglionäre Fasern für die Innervation von\nglatter Muskulatur, Herzmuskel und Drüsen)\n• Substantia alba (Weiße Substanz)\n§ Nervenfasern zum/vom Gehirn bilden aszendierende & deszendierende Tractus\n• Funiculus posterior (Hinterstrang)\n• Funiculus lateralis (Seitenstrang)\n• Funiculus anterior (Vorderstrang)"}, {"page": 103, "title": "Nervensystem: ZNS – Rückenmark", "text": "Nervensystem: ZNS – Rückenmark\n• Medulla spinalis\n§ Fortsetzung der Medulla oblongata (kaudalster Teil des Gehirns)\n§ zieht durch Foramen magnum und dann im Canalis vertebralis\n(Wirbelkanal) nach kaudal bis zum 1./2. Lendenwirbelkörper\n§ in RM-Segmente gegliedert\n§ endet in Conus medullaris\n• Rückenmarkshäute\n§ Dura mater spinalis\n§ Arachnoidea mater spinalis\n§ Pia mater spinalis\n• Filum terminale\n§ Strang aus Bindegewebe (Dura mater & Pia mater)\nzwischen Conus medullaris und 1. Coccygealwirbel\n• Cauda equina\n§ “Pferdeschweif“ aus Spinalnervenwurzeln da RM kürzer als Wirbelsäule ist"}, {"page": 104, "title": "Nervensystem: Peripheres Nervensystem", "text": "Nervensystem: Peripheres Nervensystem\n• 31-32 Spinalnerven (Nn. spinales)\n§ enger Bezug zum Rückenmark: ein RM-Segment entspricht einem Spinalnervenpaar\n§ 8 Zervikalnervenpaare (C1-C8)          treten oberhalb des\ngleichnamigen Wirbelkörpers       § 12 Thorakalnervenpaare (Th1-Th8)\naus (Ausnahme: C8)\n§ 5 Lumbalnervenpaare (L1-L5)\ntreten unterhalb\n§ 5 Sakralnervenpaare (S1-S5)           des gleichnamigen\nWirbelkörpers aus       § 1-2 Kokzygealnervenpaare\n• 12 Hirnnerven (Nn. craniales)\n§ entspringen aus dem Hirnstamm\n§ versorgen Kopf-Hals-Bereich\n(Ausnahme: N. vagus, N. accessorius)\n§ Hirnnerv I und II sind strenggenommen\nnicht Teil des PNS\n• periphere Nervenäste\n§ Äste von Spinal- und Hirnnerven,\ndie zu Zielen in der Peripherie ziehen\n§ z.B. N. ischiadicus, N. lingualis, N. radialis"}, {"page": 105, "title": "Nervensystem: PNS – Verbindung zum ZNS", "text": "Nervensystem: PNS – Verbindung zum ZNS\n• Spinalnerv\n§ ein Paar Spinalnerven geht aus einem RM-Segment hervor\n§ wird bei Durchtritt durch das Foramen intervertebrale gebildet\n§ Radix anterior/ventralis/motoria (Vorderwurzel)\n• Efferenzen vom Vorderhorn des Rückenmarks treten hier aus\n§ Radix posterior/dorsalis/senoria (Hinterwurzel)\n• Afferenzen treten hier ins Hinterhorn des Rückenmarks ein\n§ Spinalganglion\n• Anhäufung von pseudounipolaren sensiblen Neuronen\n• mit Mantelzellen umhüllt\n§ teilt sich nach F. intervertebrale in\n• Ramus anterior: Extremitäten, ventrolateraler Rumpf\n• Ramus posterior: dorsaler Rumpf\n• Ramus menigeus: Wirbelkanal, Rückenmarkshäute\n• Rami communicantes: für autonomes Nervensystem"}, {"page": 106, "title": "Nervensystem: PNS – Aufbau eines peripheren Nervs", "text": "Nervensystem: PNS – Aufbau eines peripheren Nervs\nEin peripherer Nerv ist ein Bündel aus efferenten (motorischen\nund/oder vegetativen) und afferenten (sensiblen) Nervenfasern.\nAUSNAHME: Manche Hirnnerven sind rein afferent (sensorisch)\noder rein efferent (motorisch).\nDie Somata der efferenten Neuronen sitzen in der grauen Substanz\ndes Rückenmarks, die der afferenten Neurone im Spinalganglion.\n• Hüllen\n§ Endoneurium                                              Lokalanästhetika müssen\n• umhüllt eine Nervenfaser            diese Barriere                                                       überwinden.\n• Ernährung und Regeneration\n§ Perineurium\n• umhüllt ein Nervenfaserbündel aus 10 bis einigen 100 Axonen\n•  Diffusionsbarriere, Schranke für Toxine (Perineuralscheide)\n§ Epineurium\nACHTUNG! “Rein motorische“ periphere Nerven führen auch           • umhüllt als äußere Nervenhülle viele Faserbündeln\nafferente Fasern (propriozeptive Fasern). „Rein sensible“\n• mechanische Stabilität, Schutz, Einbettung                                                                         Hautnerven führen auch efferente Fasern (vegetative Fasern\n•  steht proximal mit der Dura mater in Verbindung                            für Schweißsekretion, Vasokonstriktion, Haaraufrichtung)."}, {"page": 107, "title": "Nervensystem: PNS – Segmentale Innervation", "text": "Nervensystem: PNS – Segmentale Innervation\n• Segmentale (radikuläre) Innervation: die segmentale Organisation des Rückenmarks\nspiegelt sich in der peripheren Versorgung des Körpers wider\n§ Dermatom\n• Hautbereich, der sensibel von den Fasern eines RM-Segments (eines Spinalnervs) versorgt wird\n• zwischen zwei benachbarten Dermatomen bestehen Überlappungszonen\n§ Myotom\n• Muskel oder Muskelgruppe, die von einem RM-Segment (Spinalnerv) innerviert wird\n•  die meisten Muskeln werden aber polysegmental innerviert\n§ Im Bereich des Rumpfes ziehen zum Beispiel\ndie Rr. ventrales als Interkostalnerven zwischen\nden Rippen (in den Interkostalräumen) nach\nventral und innervieren dort segmental die\nInterkostalmuskeln und die Haut in diesem Bereich.\n§ Im Bereich der Extremitäten kommt es jedoch zur\nVermischung von Fasern aus verschiedenen\nRM-Segmenten (periphere Innervation)."}, {"page": 108, "title": "Nervensystem: PNS – Periphere Innervation", "text": "Nervensystem: PNS – Periphere Innervation\n• Periphere Innervation: gemischt-segmentale periphere Nerven führen Fasern zu den Zielorganen\n§ Plexusbildung\n•  die Rr. anteriores mehrerer Spinalnerven verflechten sich zu einem Nervenplexus\n• es entstehen gemischt-segmentale periphere Nerven, d.h. Nerven mit Fasern aus mehreren Segmenten\n§ gemischt-segmentale periphere Nerven\n• neu gebildeten Nerven ziehen zu Muskeln und Hautarealen\n• segmentale Ordnung der Fasern in den Nerven bleibt jedoch erhalten\n• Fasern enden in den Extremitäten wieder segmental geordnet\n• somit kann man auch hier von Dermatomen und Myotomen sprechen\n• Myotom: eine Kernsäule aus Motoneuronen, die einen Muskel innervieren, erstreckt\nsich in den meisten Fällen über mehr als ein RM-Segment (polysegmental)"}, {"page": 109, "title": "Nervensystem: PNS – Periphere Innervation", "text": "Nervensystem: PNS – Periphere Innervation\n• Somatische Nervenplexus\n§ Plexus cervicalis (C1-C4)\n• Kopf\n• Hals\n•  Zwerchfell\n§ Plexus brachialis (C5-Th1)\n•  Schulter\n• Ober- & Unterarm\n• Brust & Rücken\n§ Plexus lumbosacralis\n• Plexus lumbalis (L1-L4)\n• Hüfte & Genitalien\n• Ober- & Unterschenkel\n• Plexus sacralis (L4-S4)\n• Gesäß\n• Ober- & Unterschenkel\n• Fuß\n§ Plexus coccygeus (S5-Co2)\n• Haut von Steißbein und Anus"}, {"page": 110, "title": "Nervensystem: PNS – Segmentale & periphere Innervation", "text": "Nervensystem: PNS – Segmentale & periphere Innervation\n• In den Extremitäten liegen sowohl periphere als auch segmentale Innervation vor.\nIm Unterschied zum Rumpf stimmen ihre Grenzen jedoch nicht überein.\n• Beispiel: N. femoralis\n§ Aus dem Plexus lumbalis geht der N. femoralis\nmit Fasern der Segmente L2 – L4 hervor.\n§ Motorisch innerviert er mehrere Muskeln, z.B. den\nM. quadriceps femoris an der Vorderseite des Oberschenkels.\n§ Sensibel innerviert er die Haut der Vorderseite des\nOberschenkels sowie der medialen Seite von\nUnterschenkel und Fuß.\n• Dabei sind seine Fasern aus L2, L3 und L4 segmental\nvon proximal nach distal angeordnet.\n• Angrenzende Gebiete werden auch von Fasern\naus L2, L3 und L4 sensibel innerviert. Diese gelangen\naber über andere periphere Nerven zu ihren\nInnervationsgebieten.\nz.B. lateral an das Innervationsgebiet des N. femoralis\nangrenzenden liegt das Innervationsgebiet des\nN. cutaneus femoralis lateralis.\n• Segmentale Dermatome im Extremitätenbereich werden\nalso durch segmentale Endigung der Fasern mehrerer\nperipherere Nerven gebildet.\nsegmentale Innervation                      periphere Innervation"}, {"page": 111, "title": "KLINIKNervensystem: PNS – Segmentale & periphere Innervation", "text": "KLINIKNervensystem: PNS – Segmentale & periphere Innervation\n• Läsionen von Spinalnerven oder deren Hinterwurzel\n(z.B. durch Bandscheibenvorfall, Foramenstenose) führen\nzu Empfindungsstörungen in Hautarealen, die den\nDermatomen der betroffenen RM-Segmente entsprechen.\n• Läsionen von peripheren Nerven (durch Druck,\nKompression, Durchtrennung) führen zu\nEmpfindungsstörungen in Hautarealen, die dem\nInnervationsgebiet des jeweiligen peripheren Nervs\nentsprechen.\nsegmentale Innervation                      periphere Innervation"}, {"page": 112, "title": "KLINIKNervensystem: PNS – Segmentale & periphere Innervation", "text": "KLINIKNervensystem: PNS – Segmentale & periphere Innervation\n• Läsionen von Spinalnerven oder deren Vorderwurzel (z.B.\ndurch Bandscheibenvorfall, Foramenstenose) führen zu\nParesen eines Myotoms.\n§ Da ein Muskel meist von mehreren Segmenten innerviert wird\n(polysegmental) und innerhalb des Muskels die Segmente grob\nsegmental gegliedert sind, kommt es meist zu einem\ninkompletten Ausfall (Parese) und nicht zu einer kompletten\nLähmung (Paralyse).\n§ Manche Muskeln werden monosegmental (d.h. vorwiegend von\neinem RM-Segment) innerviert und können als Kennmuskel\nbenutzt werden. Dies hilft bei der Erkennung und Einordnung\neiner Schädigung einzelner RM-Segmente.\n• Läsionen von peripheren Nerven (durch Druck,\nKompression, Durchtrennung) führen zu Paresen bzw.\nParalysen von Muskeln, die von dem betroffenen\nperipheren Nerven innerviert werden."}, {"page": 113, "title": "KLINIKNervensystem: Reflexe", "text": "KLINIKNervensystem: Reflexe\n• schnelle, unwillkürliche Reaktion auf einen Reiz\n• Schutz, Stabilisierung, automatische Steuerung von Bewegungen\n• über Reflexbogen vermittelt\n§ Reizaufnahme (Muskelspindel registriert Muskeldehnung)\n§ Reizweiterleitung über afferente Fasern zum RM\n§ Reizübertragung auf Motoneuron\n§ Reizweiterleitung über efferente Fasern zum Muskel\n§ Muskelkontraktion als Reaktion\n• z.B. Patellarsehnenreflex als wichtiger\nneurologischer Prüfreflex der RM-Segmente L3/L4\nNeben dem beschriebenen monosynaptischen Reflex\n(Eigenreflex), bei dem der Ort der Reizaufnahme und\nEffektor identisch sind, gibt es auch Fremdreflexe.\nEin Fremdreflex (polysynaptischer Reflex) wird durch\neinen Reiz in einem anderen Gewebe (z.B. Schmerz in\nder Haut) ausgelöst. Dieser Reiz wird über afferente\nFasern ins RM geleitet und über ein oder mehrere\nInterneurone auf ein Motoneuron verschaltet, um als\nReaktion zu einer Muskelkontraktion zu führen."}, {"page": 114, "title": "Nervensystem: Vegetatives Nervensystem", "text": "Nervensystem: Vegetatives Nervensystem\n• Funktionen\n§ automatische (unbewusste) Steuerung lebenswichtiger Körperfunktionen wie z.B. Atmung,\nKreislauf, Wasserhaushalt, Körpertemperatur, Stoffwechsel, Verdauung, etc.\n§ Regulation & Anpassung der einzelnen Organfunktionen an wechselnde Umwelterfordernisse\n§ Aufrechterhaltung des inneren Körpermillieus (Homöostase)\n• Antagonistische Anteile (viszeromotorisch*)\n• Sympathikus: energiemobilisierende und aktivitätssteigernde Funktion für den Körper\n• Erhöhung der Herzfrequenz und des Blutdrucks\n• Erweiterung der Bronchien\n• Hemmung der Verdauung (Herabsetzung von Peristaltik und Drüsentätigkeit)\n• Erweiterung der Pupillen (Mydriasis)\n• Freisetzung von Glukose aus der Leber\n• Parasympathikus: Konservierung und Wiederaufbau der Körperenergien\n• Verlangsamung der Herzfrequenz\n• Förderung der Verdauung (Steigerung der Peristaltik) und Speichelproduktion\n•  Aktivierung der Drüsentätigkeit\n• Verengung der Pupillen (Miosis)\n•  Stimulierung der Harnblasenentleerung\n*viszerosensibel:\n• Enterales Nervensystem: lokale Steuerung der Motilität, Sekretion, Durchblutung des                                                 hier gibt es keine\nGliederung in          Gastrointestinaltrakts (liegt intramural und arbeitet z.T. unabhängig von (Para)Sympathikus)                                                                                                                                          Sympathikus und\nParasympathikus\nTrepel, Neuroanatomie"}, {"page": 115, "title": "Nervensystem: VNS – viszeromotorische Verschaltung", "text": "Nervensystem: VNS – viszeromotorische Verschaltung\n• Unterschiede der somato- und viszeromotorischen Verschaltung\n§  1: Somatomotorische Nervenbahnen bestehen aus einem Neuron.\n§ 2, 3: Viszeromotorische Nervenbahnen bestehen aus zwei hintereinander\ngeschalteten Neuronen. Die Umschaltung geschieht in vegetativen Ganglien\n(Ansammlung von Somata viszeromotorischer Neuronen).\n• Sympathikus (2)\n§ Ganglion liegt nah am 1. Neuron bzw. fern vom Erfolgsorgan\n(kurze präganglionäre Strecke)\n§ im Ganglion Umschaltung von 1. auf 2. Neuron über Acetylcholin\n(von prä- auf postganglionär)\n§ lange postganglionäre Strecke bis zum Erfolgsorgan\n§ starke Signaldivergenz: ein präganglionäres Neuron erreicht bis zu 20 postganglionäre Neurone\n§ 2. Neuron innerviert Erfolgsorgan über Noradrenalin (wirkt langsamer, länger und diffuser, weil es langsam abgebaut wird)\n§ starke Signaldivergenz und Wirkung von Noradreanlin ideal für länger wirkende, weitreichende Reaktion auf Stress und Gefahr\n• Parasympathikus (3)                                                                                 AUSNAHME: Innervation von                                                                                                                                Schweißdrüsen erfolgt auch\n§ Ganglion liegt erst nah oder sogar in der Wand (intramural) des Erfolgsorgans (lange präganglionäre Strecke)              postganglionär über\nAcetylcholin.\n§ Im Ganglion Umschaltung von 1. auf 2. Neuron über Acetylcholin\n§ kurze postganglionäre Strecke mit geringer Signaldivergenz (nur ein bis wenige postganglionäre Neurone)\n§ 2. Neuron innerviert Erfolgsorgan über Acetylcholin (wirkt lokal, schneller und kürzer, weil es rasch abgebaut wird)\n§ geringe Signaldivergenz und Wirkung von Acetylcholin ideal für gezielte, präzise und lokale Feinsteuerung bei Ruhe\nTrepel, Neuroanatomie"}, {"page": 116, "title": "Nervensystem: VNS – Anatomie", "text": "Nervensystem: VNS – Anatomie"}, {"page": 117, "title": "Nervensystem: VNS – Sympathikus", "text": "Nervensystem: VNS – Sympathikus\n• Ursprung im ZNS (thorakolumbal)\n§ erstes viszeromotorisches Neuron liegt im Cornu laterale\ndes Thorakal- und oberen Lumbalmarks (Th1 – L2)\n• vom ZNS ins PNS\n§ präganglionäre (myelinisierte) Fasern ziehen über\ndie Radix ventralis in den Truncus n. spinalis und\nverlassen diesen über den R. communicans albus\nzu einem paravertebralen Ganglion des Grenzstrangs\n• PNS\n§ Truncus sympathicus (Grenzstrang): paarige Kette\nvon 22-25 vegetativen Ganglien beidseits der Wirbelsäule\n• Rami (Rr.) interganglionares: Verbindung zw. Ganglien\n•  Rr. communicantes albi: Verbindung zw. RM und thorakolumbalen Ganglien\n•  Rr. communicantes grisei: Verbindung zwischen Ganglien und Peripherie\n• paravertebrale Ganglien des Grenzstrangs\n•  11 thorakale Ganglien & 4 lumbale Ganglien\n• 3 zervikale Ganglien\n•  Ggl. cervicale superius, medius, inferius\n•  Ggl. cervicale inferius & Th1 Ganglion oft zu Ggl. stellatum verschmolzen\n• 4 sakrale Ganglien\n• kokzygeale Ganglien (oft zu Ggl. impar verschmolzen)"}, {"page": 118, "title": "Nervensystem: VNS – Sympathikus", "text": "Nervensystem: VNS – Sympathikus\n• Ort der Umschaltung von 1. auf 2. Neuron (organfern)\nSpinalganglien\n§ im paravertebralen Grenzstrangganglion\n• im selben Segment oder in anderen Segmenten nach Auf- oder Abstieg auch zu zervikalen\nbzw. sakralen/kokzygealen Ganglien und mit Möglichkeit zu konvergenten und divergenten                                               N. vagus\nVerschaltungen                                                                                                                  Grenzstrang-\nganglien\n• Innervation von glatter Muskulatur und Drüsen in die Peripherie: postganglionäre\n(unmyelinisierte) Fasern ziehen über den R. communicans griseus und R. ventralis & dorsalis        N. splanchnicus\nmajor\n• Innervation von thorakalen Organen: postganglionäre Fasern über direkte viszerale Äste\n§ im prävertebralen Ganglion                                                                                                                                                                                 Aorta descendens\n• präganglionäre Fasern ziehen ohne                                                                                         N. splanchnicus                                                                                                                                               minor\nUmschaltung durch paravertebrales\nGanglion durch\n• ziehen als Nn. splanchnici zu Ganglien                                                                                                                        Plexus coeliacus\nPlexus mesentericus\nam Abgang von großen Arterien aus                                                                                                                                       superior\nder Aorta, z.B. Ggl. coeliacum, Ggl.                                                                                                                             Plexus aorticus\nabdominalis\nmesentericum superius, …\nPlexus mesentericus\n• Innervation von Bauch- und Beckenorganen:                                                                                                                                            inferior\nPlexus hypogastricus\npostganglionäre Fasern ziehen                                                                                                                                                superior\nentlang großer Arterien zu ihren                                                                                                                                    A. iliaca communis\nZielorganen und innervieren deren glatte\nMuskulatur, Drüsen und Sphinkter                                                                                                                                  N. hypogastricus\nPlexus hypogastricus\nAUSNAHME: Das Nebennierenmark wird von                                                                                                                                                                    inferior\npräganglionären Fasern erreicht und direkt beeinflusst.\nGgl. impar"}, {"page": 119, "title": "Nervensystem: VNS – Parasympathikus", "text": "Nervensystem: VNS – Parasympathikus\n• Ursprung im ZNS (kraniosakral)                                                                            dem Parasympathikus                                                                                manchmal       § kranialer Anteil                                                   Der N. vagus wird                                                                                                         parasympathische                                                                                                        wichtige                                                                                                 weil er viele                                                                                     gleichgesetzt,                      Hirnnerv erreicht           •  erstes               viszeromotorisches Neuron liegt in einem Hirnnervenkern                                                                                           „vagabundierender“                                                                                           Als                                                                                                     führt.                                                                          Fasern                                                                                                                                    GI-Trakts.                                                                                 und einen Großteil des        im Hirnstamm                                                                              Lunge                                                                                         Herz,                                                                                er dabei\n§ sakraler Anteil\n•  erstes viszeromotorisches Neuron liegt in der Substantia\nintermedia lateralis des Sakralmarks (S2 – S4)\n• PNS\n§ kranialer Anteil\n• präganglionäre (myelinisierte) Fasern verlaufen in folgenden Hirnnerven\n• N. vagus (X) zu Herz, Lunge, Gastroinstinaltrakt (bis Flexura coli sinistra)\n• N. oculomotorius (III) zum Auge\n• N. facialis (VII) zu Tränen-, Nasen-, Gaumen- und Speicheldrüsen\n• N. glossopharyngeus (IX) zur Ohrspeicheldrüse\n§ sakraler Anteil\n• präganglionäre (myelinisierte) Fasern ziehen über die Radix ventralis\nin den Truncus n. spinalis und als Nn. splanchnici pelvici zu aboralem\nGastrointestinaltrakt (Colon descendens und sigmoideus, Rektum),\nHarnblase und Geschlechtsorganen"}, {"page": 120, "title": "Nervensystem: VNS – Parasympathikus & vegetative Plexus", "text": "Nervensystem: VNS – Parasympathikus & vegetative Plexus\n• Ort der Umschaltung von 1. auf 2. Neuron (organnah)\n§ N. III, VII, IX: in lokalen Kopf- und Halsganglien (Ggl. ciliare,\npterygopalatinum, submandibulare, oticum)\n§ N. X & sakraler Parasympathikus: in organnahen Ganglien oder intramural\n• Vegetative Nervenplexus\n§ Netzwerk aus vegetativen Fasern entlang von Blutgefäßen und\nin der Nähe von Organen, die diese Fasern versorgen\n• viserzomotorische Nervenfasern\n• sympathische, postganglionäre Fasern\n• parasympathischen, präganglionären Fasern\n•  viserzosensible Nervenfasern\n• sympathische (prävertebrale) Ganglien\n§ z.B. Plexus cardiacus an der Herzkrone,\nPlexus oesophageus rund um die Speiseröhre,\nPlexus mesentericus superior rund um die gleichnamige Arterie\nDrenckhahn, Beinninghoff, Anatomie"}, {"page": 121, "title": "Nervensystem: VNS – Viszerosensible Innervation", "text": "Nervensystem: VNS – Viszerosensible Innervation\n• viszeroafferente Fasern leiten Informationen über Dehnung, chemische Reize, Durchblutung, Temperatur,\nSchmerz… von den inneren Organen, Schleimhäuten und Blutgefäßen über periphere Nerven zum ZNS\n§ spinal\n• aus der Peripherie ins paravertebrale Ganglion\n• über den R. communicans albus ins Spinalganglion\n(hier liegt das Soma des Neurons)\n• über die Radix posterior n. spinalis zum Cornu posterius des RMs\n• von dort weiter ins Gehirn\n§ kranial\n•  in den Hirnstamm (Ncl. tractus solitarii) über\n•  N. vagus (X)\n•  N. glossopharyngeus (IX)\n•  N. facialis (VII)"}, {"page": 122, "title": "KLINIKNervensystem: VNS – Viszerosensible Innervation", "text": "KLINIKNervensystem: VNS – Viszerosensible Innervation\n• viszerokutaner Reflex\n§ Reflexbogen, bei dem ein Reiz aus einem inneren Organ\n(viszeral) über das Rückenmark eine Reaktion an der\nKörperoberfläche (kutan) auslöst (z.B. Gänsehaut, Rötung\noder auch Verspannung, Muskeltonuserhöhung)\n§ Grundlage: Konvergenz von viszeralen und somatischen\nsensiblen Fasern im Hinterhorn\n§ z.B. Herzinfarkt\n•  kardiale Schmerzfasern und sensible Hautfasern\nkonvergieren auf dasselbe postsynaptische Neuron der\naufsteigenden Schmerzbahn\n• im ZNS kann nicht unterschieden\nwerden, ob die Schmerzen im\nHerzen oder der Haut entstanden sind\n• Schmerzen werden somit auf\nDermatome C8 – Th5 „übertragen“,\nsomit an linker Brust, linker Schulter\nund linkem Arm „gefühlt“\nkutanoviszeraler Reflex: Reflexbogen, bei dem ein\nReiz an der Körperoberfläche eine Reaktion in einem\ninneren Organ auslöst\n> anatomische Grundlage für Akupressur/Akupunktur"}, {"page": 123, "title": "KLINIKNervensystem: VNS – HEAD-Zonen", "text": "KLINIKNervensystem: VNS – HEAD-Zonen\n• HEAD-Zone\n§ Hautareal, in dem bei Erkrankung innerer Organe übertragene\nSchmerzen auftreten\n§ Grundlage: viszerokutane Reflexbögen\n§ klinisch hoch relevant für Diagnostik, um “somatische“ Schmerzen\nnicht voreilig als harmlos zu interpretieren\nBeispiele\nHERZ    Th 1-5         linke Brust, Arm und Schulter\nMAGEN   Th6-9        rechtes Epigastricum, mittlere Rückenregion\nLEBER    Th8-11        rechter Rippenbogen\nHARNBLASE Th11-L1    Unterbauch"}, {"page": 124, "title": "EVSNervensystem: VNS – Enterisches Nervensystem", "text": "EVSNervensystem: VNS – Enterisches Nervensystem\n• autonom arbeitendes Nervengeflecht in der Wand des\nGastrointestinaltrakts\n§ Koordination der Verdauung\n(Peristaltik, Sekretion, Resorption, Blutfluss)\n§ Wechselwirkungen mit Sympathikus, Parasympathikus und ZNS\n§ Hauptplexus\n• Plexus myentericus AUERBACH: liegt zw. Längs- und\nRingmuskelschicht und steuert Peristaltik\n• Plexus submucosus MEISSNER: liegt in der Submukosa\nund reguliert Sekretion und Durchblutung"}],Q=[{"page": 2, "q": "Was beschreibt die Histologie?", "opts": ["Die Lehre der Gewebe", "Die Lehre der Zellen", "Die Entwicklung von Organismen", "Die räumliche Lage von Organen", "Die makroskopische Präparation"], "answer": 0, "why": "Histologie ist die Lehre der Gewebe."}, {"page": 3, "q": "Welche Reihenfolge entspricht der biologischen Hierarchie?", "opts": ["Organe → Zellen → Gewebe → Organismus", "Zellen → Gewebe → Organe → Organsysteme → Organismus", "Gewebe → Zellen → Organe → Organismus", "Zellen → Organe → Gewebe → Organsysteme", "Organsysteme → Organe → Zellen → Gewebe"], "answer": 1, "why": "Die Hierarchie verläuft von Zellen über Gewebe und Organe zu Organsystemen und Organismus."}, {"page": 6, "q": "Welche Aussage zur anatomischen Variation trifft zu?", "opts": ["Sie ist immer pathologisch", "Sie bedeutet stets eine Funktionsstörung", "Sie liegt innerhalb der natürlichen Variationsbreite und hat keinen Krankheitswert", "Sie tritt ausschließlich bei Kindern auf", "Sie ist mit einer Anomalie gleichzusetzen"], "answer": 2, "why": "Eine Variation ist eine natürliche Abweichung ohne Krankheitswert."}, {"page": 7, "q": "Was kleidet die Wand einer serösen Körperhöhle aus?", "opts": ["Viszerale Serosa", "Parietale Serosa", "Periost", "Endost", "Perichondrium"], "answer": 1, "why": "Die parietale Serosa liegt an der Höhlenwand; die viszerale bedeckt Organe."}, {"page": 9, "q": "Was bedeutet sekundär retroperitoneal?", "opts": ["Das Organ liegt im Thorax", "Das Organ ist vollständig von Pleura umgeben", "Das Organ ist frei im Bauchraum aufgehängt", "Das Organ ist entwicklungsbedingt mit der hinteren Bauchwand verwachsen", "Das Organ befindet sich in der Schädelhöhle"], "answer": 3, "why": "Sekundär retroperitoneale Organe sind durch Verlagerung während des Wachstums an der hinteren Bauchwand verwachsen."}, {"page": 14, "q": "Wie zeigen die Handflächen in der anatomischen Neutralposition?", "opts": ["Nach hinten", "Zur Körpermitte", "Nach vorne", "Nach unten", "Zueinander"], "answer": 2, "why": "In der anatomischen Neutralposition zeigen die Handflächen nach anterior."}, {"page": 15, "q": "Welche Ebene trennt den Körper in obere und untere Abschnitte?", "opts": ["Sagittalebene", "Medianebene", "Frontalebene", "Transversalebene", "Koronalebene"], "answer": 3, "why": "Die Transversal- oder Axialebene verläuft quer."}, {"page": 16, "q": "Was bedeutet distal?", "opts": ["Zur Körpermitte hin", "Rumpffern", "Kopfwärts", "Oberflächlich", "Rückenwärts"], "answer": 1, "why": "Distal bedeutet rumpffern."}, {"page": 19, "q": "Um welche Achse erfolgen Flexion und Extension im Hüftgelenk?", "opts": ["Longitudinalachse", "Sagittalachse", "Transversalachse", "Vertikalachse", "Keine Achse"], "answer": 2, "why": "Flexion und Extension erfolgen um die Transversalachse in der Sagittalebene."}, {"page": 22, "q": "Welche Knochenart enthält luftgefüllte Räume?", "opts": ["Ossa longa", "Ossa brevia", "Ossa plana", "Ossa pneumatica", "Ossa sesamoidea"], "answer": 3, "why": "Ossa pneumatica enthalten luftgefüllte, schleimhautausgekleidete Räume."}, {"page": 25, "q": "Wie heißt das schwammartige Knocheninnere?", "opts": ["Periost", "Substantia compacta", "Substantia spongiosa", "Endost", "Diaphyse"], "answer": 2, "why": "Die Spongiosa bildet ein Netz aus Trabekeln im Inneren."}, {"page": 28, "q": "Welches Knochenmark ist blutbildend?", "opts": ["Medulla ossium flava", "Medulla ossium rubra", "Perichondrium", "Synovia", "Kortikalis"], "answer": 1, "why": "Das rote Knochenmark (Medulla ossium rubra) dient der Blutbildung."}, {"page": 29, "q": "Welcher Knorpel findet sich typischerweise in Menisken?", "opts": ["Elastischer Knorpel", "Hyaliner Knorpel", "Faserknorpel", "Knochengewebe", "Glatte Muskulatur"], "answer": 2, "why": "Menisken bestehen aus Faserknorpel."}, {"page": 32, "q": "Was unterscheidet eine Diarthrose von einer Synarthrose?", "opts": ["Ein Gelenkspalt", "Eine Knochenhaut", "Kollagenfasern", "Eine Blutversorgung", "Eine Gelenkverknöcherung"], "answer": 0, "why": "Diarthrosen sind echte Gelenke mit Gelenkspalt."}, {"page": 34, "q": "Welche Verbindung besteht aus Faserknorpel?", "opts": ["Synchondrose", "Symphyse", "Syndesmose", "Synostose", "Gomphosis"], "answer": 1, "why": "Eine Symphyse enthält Faserknorpel."}];let idx=0,tab='learn',qindex=0,answered=false,score=0;let state=JSON.parse(localStorage.getItem('ang-progress')||'{"done":[],"xp":0,"mistakes":{}}');function save(){localStorage.setItem('ang-progress',JSON.stringify(state))}function el(id){return document.getElementById(id)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderNav(){el('nav').innerHTML=L.map((l,i)=>`<button class="item ${idx===i?'active':''} ${state.done.includes(i)?'done':''}" onclick="choose(${i})">${i+1}. ${escapeHTML(l.title.slice(0,55))}</button>`).join('')}function choose(i){idx=i;tab='learn';render()}function setTab(t){tab=t;render()}function render(){let l=L[idx];el('xp').textContent=state.xp+' XP';el('prog').style.width=(state.done.length/L.length*100)+'%';el('count').textContent=state.done.length+'/'+L.length+' Folien abgeschlossen';renderNav();el('title').textContent=`Level ${idx+1} · ${l.title}`;el('tabs').innerHTML=['learn','cloze','quiz','exam'].map((t,i)=>`<button class="${tab===t?'':'secondary'}" onclick="setTab('${t}')">${['Lernen','Lückentext','Best of Five','Prüfung'][i]}</button>`).join('');let s='';if(tab==='learn'){let chunks=l.text.split('\n').filter(x=>x.trim());let summary=chunks.filter(x=>x.length>28).slice(1,5);s=`<div class="panel"><span class="pill">Originalskript · Seite ${l.page} von ${L.length}</span><h3>Das lernst du hier</h3><p>${escapeHTML(summary.join(' · ')||l.title)}</p><h3>Vollständiger Folieninhalt</h3><pre>${escapeHTML(l.text)}</pre><p class="muted">Der Text stammt aus der PDF. Diagramme und Bilder sind in der Folienansicht enthalten.</p><button onclick="showFigure()">Originalfolie mit Abbildungen anzeigen</button><div id="figure"></div></div><div class="panel"><h3>Aktives Erinnern</h3><p>Erkläre die wichtigsten Begriffe dieser Folie mit eigenen Worten. Prüfe anschließend dein Wissen.</p><button onclick="complete()">Level als gelernt markieren (+10 XP)</button><button class="secondary" onclick="next()">Nächste Folie →</button></div>`}else if(tab==='cloze'){let terms=l.text.split('\n').map(x=>x.trim()).filter(x=>x.length>18&&x.length<170&&x.includes(':'));let phrase=terms[0]||l.text.split('\n').find(x=>x.length>35)||l.title;let parts=phrase.split(':');let answer=parts.length>1?parts[0].replace(/^[•§\s]+/,'').trim():phrase.split(' ')[0];let rest=parts.length>1?'_____ : '+parts.slice(1).join(':'):'_____ '+phrase.split(' ').slice(1).join(' ');s=`<div class="panel"><h3>Lückentext zur Folie ${l.page}</h3><p>${escapeHTML(rest)}</p><input id="fill" placeholder="Fehlenden Begriff eingeben"><button onclick="checkFill(${JSON.stringify(answer).replace(/"/g,'&quot;')})">Überprüfen</button><p id="fillResult"></p></div>`}else if(tab==='quiz'){let relevant=Q.filter(q=>q.page===l.page);s=relevant.length?`<div id="qbox"></div>`:`<div class="panel"><p>Für diese Folie gibt es noch keine redaktionell geprüfte Best-of-Five-Frage. Die Originalfolie und Lückentext-Übung sind verfügbar.</p><button onclick="setTab('exam')">Gemischte Prüfung starten</button></div>`}else{s=`<div class="panel"><h3>Prüfungssimulation</h3><p>${Q.length} Best-of-Five-Fragen, genau eine richtige Antwort pro Frage. Fragen stammen aus ausgewählten Folien des Skripts.</p><button onclick="startExam()">Prüfung starten</button><div id="examBox"></div></div>`}el('content').innerHTML=s;if(tab==='quiz'&&Q.some(q=>q.page===l.page))drawQ(Q.find(q=>q.page===l.page),'qbox')};function next(){choose(Math.min(idx+1,L.length-1))}function complete(){if(!state.done.includes(idx)){state.done.push(idx);state.xp+=10;save()}render()}function showFigure(){el('figure').innerHTML=`<img class="figure" loading="lazy" src="pages/p${String(idx+1).padStart(3,'0')}.jpg" alt="Originalfolie ${idx+1}">`};function checkFill(a){let v=el('fill').value.trim().toLocaleLowerCase('de');el('fillResult').textContent=v===a.toLocaleLowerCase('de')?'Richtig! +5 XP':'Noch nicht. Richtige Antwort: '+a;if(v===a.toLocaleLowerCase('de')){state.xp+=5;save();el('xp').textContent=state.xp+' XP'}}function drawQ(q,target){answered=false;el(target).innerHTML=`<div class="panel"><span class="pill">Folie ${q.page}</span><h3>${escapeHTML(q.q)}</h3>${q.opts.map((o,i)=>`<button class="option" id="opt${i}" onclick="answer(${i},'${target}')">${'ABCDE'[i]}. ${escapeHTML(o)}</button>`).join('')}<p id="feedback"></p></div>`;window.currentQ=q}function answer(i,target){if(answered)return;answered=true;let q=window.currentQ;document.querySelectorAll('#'+target+' .option').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===i&&i!==q.answer)b.classList.add('wrong')});el('feedback').textContent=(i===q.answer?'Richtig! ':'Nicht ganz. ')+q.why;if(i===q.answer){state.xp+=15;score++}else state.mistakes[q.page]=(state.mistakes[q.page]||0)+1;save();el('xp').textContent=state.xp+' XP';if(target==='examBox'){let b=document.createElement('button');b.textContent='Nächste Frage →';b.onclick=advanceExam;el('feedback').appendChild(b)}}function startExam(){qindex=0;score=0;advanceExam()}function advanceExam(){if(qindex>=Q.length){el('examBox').innerHTML=`<div class="panel"><h3>Ergebnis: ${score}/${Q.length} (${Math.round(score/Q.length*100)}%)</h3><p>Wiederhole falsch beantwortete Themen und starte den Test erneut.</p><button onclick="startExam()">Erneut versuchen</button></div>`;return}drawQ(Q[qindex++],'examBox')}render();</script></body></html>
